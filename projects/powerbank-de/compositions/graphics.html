    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap');

    <script>
      (function() {
        const tl = gsap.timeline({ paused: true });

        function showCard(id, inTime, outTime, opts) {
          const el = document.getElementById(id);
          tl.to(el, { opacity: 1, y: 0, duration: 0.4, ease: 'power2.out' }, inTime);
          tl.to(el, { opacity: 0, y: 8, duration: 0.3, ease: 'power2.in' }, outTime - 0.3);
          gsap.set(el, { y: 12 });
        }

        function countUp(numId, target, inTime) {
          const el = document.getElementById(numId);
          if (!el) return;
          tl.call(() => {
            const isFloat = String(target).includes('.');
            gsap.to({ v: 0 }, {
              v: target,
              duration: 1.2,
              ease: 'power2.out',
              onUpdate() {
                const val = this.targets()[0].v;
                if (isFloat) {
                  el.textContent = val.toFixed(0);
                } else if (target >= 100000) {
                  el.textContent = Math.round(val).toLocaleString('de-DE');
                } else {
                  el.textContent = Math.round(val).toLocaleString('de-DE');
                }
              }
            });
          }, [], inTime + 0.1);
        }

        // Scene 1 (0–15.4s): 2 Mio stat card → show 2-7s
        showCard('card-s1', 2, 12);
        countUp('num-s1', 2000000, 2);
        tl.call(() => {
          document.getElementById('num-s1').textContent = '2 Mio.';
        }, [], 3.5);

        // Scene 2 (15.4–32.9s): Powerbank key point → 16-27s
        showCard('card-s2', 16, 27);

        // Scene 3 (32.9–48.8s): 100 Wh stat → 34-44s
        showCard('card-s3', 34, 44);
        countUp('num-s3', 100, 34);

        // Scene 4 (48.8–68.1s): Keine Ausnahmen key point → 50-63s
        showCard('card-s4', 50, 63);

        // Scene 5 (68.1–84.1s): Brandgefahr → 69-80s
        showCard('card-s5', 69, 80);

        // Scene 6 (84.1–103.2s): Grauzone comparison → 85-99s
        showCard('card-s6', 85, 99);

        // Scene 7 (103.2–120.7s): Formula → 104-112s
        showCard('card-s7', 104, 112);

        // Scene 7b: 74 Wh stat → 113-120s
        showCard('card-s7b', 113, 120);
        countUp('num-s7b', 74, 113);

        // Scene 8 (120.7–140.1s): Quote → 122-136s
        showCard('card-s8', 122, 136);

        // Scene 9 (140.1–158.3s): 800k stat → 141-154s
        showCard('card-s9', 141, 154);
        countUp('num-s9', 800000, 141);

        // Scene 10 (158.3–175s): Tipp key point → 159-170s
        showCard('card-s10', 159, 170);

        // Scene 11 (175–195.5s): 5000€ stat → 176-190s
        showCard('card-s11', 176, 190);
        countUp('num-s11', 5000, 176);

        window.__timelines['graphics'] = tl;
      })();
    </script>
