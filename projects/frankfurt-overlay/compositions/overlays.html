    <script>

            { opacity: 0, x: -16 },
            { opacity: 1, x: 0, duration: 0.4, ease: 'power2.out' },

          tl.to('#' + id,
            { opacity: 0, x: 16, duration: 0.35, ease: 'power2.in' },
            start + 2.15
          );
        }

        function showCard(id, start, dur) {
          tl.fromTo('#' + id,
            { opacity: 0, y: 12, filter: 'blur(5px)' },
            { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.65, ease: 'power2.out' },
            start
          );
          tl.to('#' + id,
            { opacity: 0, y: -8, filter: 'blur(5px)', duration: 0.55, ease: 'power2.in' },
            start + dur - 0.55
          );
        }

        /* ── INFO CARDS ──────────────────────────────────────────── */
        showCard('intro-card',       2,     4.5);
        showCard('lt-hub',           17.5,  4.5);
        showCard('stat-security',    38.5,  4.5);
        showCard('warning-peak',     62.5,  4.5);
        showCard('tip-1',            92.5,  4.5);
        showCard('timeline-graphic', 128.5, 8.0);
        showCard('tip-2',            156.5, 4.5);
        showCard('stat-bar',         185.5, 4.5);

        /* ── TIMELINE INTERNAL (within its 8s window) ────────────── */
        tl.to('.tg-step',

          129.3
        );
        tl.to('.tg-fill',
          { width: '100%', duration: 0.8, stagger: 0.65, ease: 'power1.inOut' },
          129.6
        );

        /* ── CAPTIONS ────────────────────────────────────────────── */
        /* Captions only appear in the gaps between cards/titles:
           7–13.5s | 22.5–34.5s | 44–58.5s | 67.5–88.5s |
           98–124.5s | 137–152.5s | 162–181.5s | 191–212s  */
        var captionData = [
          // Gap 1: 7–13.5s
          { id:'c01', start:7.0,  words:['Wir','erkunden','Frankfurt'] },
          { id:'c02', start:10.3, words:['Flughafen','FRA','direkt'] },

          { id:'c03', start:22.5, words:['Über','57','Millionen'] },

          // Gap 3: 44–58.5s

        /* build caption DOM */
        var layer = document.getElementById('caption-layer');
        captionData.forEach(function(c) {
          var d = document.createElement('div');
          d.id = c.id;
          d.className = 'caption';
          d.innerHTML = c.words.map(function(w) {
            return '<span class="cw">' + w + '</span>';
          }).join(' ');
          layer.appendChild(d);
        });

        /* animate captions with word highlight */
        function animateCaption(c) {
          var n = c.words.length;
          var totalDur = n <= 2 ? 2.5 : 3.2;
          var wordDur = (totalDur - 0.4) / n;

          tl.to('#' + c.id, { opacity: 1, duration: 0.2 }, c.start);

          c.words.forEach(function(_, i) {
            var wStart = c.start + 0.2 + i * wordDur;
            if (i > 0) {
              tl.to('#' + c.id + ' .cw:nth-child(' + i + ')',
                { backgroundColor: 'rgba(0,0,0,0)', color: '#fff', duration: 0.1 },
                wStart
              );
            }
            tl.to('#' + c.id + ' .cw:nth-child(' + (i + 1) + ')',
              { backgroundColor: 'rgba(245,158,11,0.85)', color: '#000', duration: 0.1 },
              wStart
            );
          });

          tl.to('#' + c.id, { opacity: 0, duration: 0.22 }, c.start + totalDur - 0.22);
        }

        captionData.forEach(animateCaption);

        window.__timelines['overlays'] = tl;
