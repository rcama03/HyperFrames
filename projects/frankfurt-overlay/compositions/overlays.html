    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* ── initial states ─────────────────────────────────────────── */
        gsap.set('.mc-row',   { opacity: 0, x: -18 });
        gsap.set('#mc-divider', { scaleX: 0 });
        gsap.set('#mc-total',   { opacity: 0, y: 6 });
        gsap.set('.cc-bar',     { width: '0%' });

        /* ── showCard ───────────────────────────────────────────────── */
        function showCard(id, start, dur) {
          tl.fromTo('#' + id,
            { opacity: 0, y: 14, filter: 'blur(6px)' },
            { opacity: 1, y: 0,  filter: 'blur(0px)', duration: 0.6, ease: 'power2.out' },
            start
          );
          tl.to('#' + id,
            { opacity: 0, y: -8, filter: 'blur(6px)', duration: 0.5, ease: 'power2.in' },
            start + dur - 0.5
          );
        }

        /* ── CARDS ──────────────────────────────────────────────────── */
        showCard('intro-card',    2,    4.5);
        showCard('stat-skytrain', 20,   4.5);
        showCard('stat-hub',      39,   4.5);
        showCard('stat-bagdrop',  58,   5.0);
        showCard('stat-security', 72,   5.0);
        showCard('stat-shuttle',  97,   4.5);
        showCard('math-card',    110,   8.0);
        showCard('compare-card', 130,   6.0);
        showCard('tip-card',     149,   4.5);
        showCard('priority-card',166,   4.5);
        showCard('plan-card',    184,   4.5);
        showCard('cta-card',     213,   4.5);

        /* ── NUMBER COUNTER: Skytrain 0→20 ─────────────────────────── */
        var skyObj = { n: 0 };
        tl.to(skyObj, {
          n: 20, duration: 1.0, ease: 'power1.out',
          onUpdate: function () {
            var el = document.getElementById('sky-num');
            if (el) el.textContent = Math.round(skyObj.n);
          }
        }, 20.6);

        /* ── NUMBER COUNTER: Security 0→45 ─────────────────────────── */
        var secObj = { n: 0 };
        tl.to(secObj, {
          n: 45, duration: 1.4, ease: 'power2.out',
          onUpdate: function () {
            var el = document.getElementById('sec-num');
            if (el) el.textContent = Math.round(secObj.n);
          }
        }, 72.6);

        /* ── MATH CARD internal animation ───────────────────────────── */
        ['.mr1', '.mr2', '.mr3', '.mr4'].forEach(function (sel, i) {
          tl.to(sel, { opacity: 1, x: 0, duration: 0.38, ease: 'power2.out' }, 110.7 + i * 0.68);
        });
        tl.to('#mc-divider', { scaleX: 1, duration: 0.38, ease: 'power1.inOut' }, 113.6);
        tl.to('#mc-total',   { opacity: 1, y: 0, duration: 0.45, ease: 'back.out(1.6)' }, 114.1);

        /* ── COMPARE CARD bar animation ─────────────────────────────── */
        tl.to('#bar-official', { width: '100%', duration: 0.75, ease: 'power2.out' }, 130.7);
        tl.to('#bar-booking',  { width: '66.7%', duration: 0.65, ease: 'power2.out' }, 131.5);

        /* ══════════════════════════════════════════════════════════════
           CAPTIONS — 141 groups covering full German voiceover
           ══════════════════════════════════════════════════════════════ */
        var captionData = [
          { id:'c01',  start:0.0,    words:["Jedes", "Jahr", "verpassen"] },
          { id:'c02',  start:1.61,   words:["Zehntausende", "Passagiere", "ihren"] },
          { id:'c03',  start:3.22,   words:["Flug", "am", "Frankfurter"] },
          { id:'c04',  start:4.83,   words:["Flughafen", "nicht", "wegen"] },
          { id:'c05',  start:6.45,   words:["Streiks", "oder", "Verspätungen"] },

        /* animate captions with word highlight */
        function animateCaption(c) {
          var n = c.words.length;
          var totalDur = n <= 2 ? 2.5 : 3.2;
          var wordDur  = (totalDur - 0.4) / n;

          tl.to('#' + c.id, { opacity: 1, duration: 0.2 }, c.start);

            var wStart = c.start + 0.2 + i * wordDur;
            if (i > 0) {

                { backgroundColor: 'rgba(0,0,0,0)', color: '#fff', duration: 0.1 }, wStart);

            tl.to('#' + c.id + ' .cw:nth-child(' + (i + 1) + ')',
              { backgroundColor: 'rgba(245,158,11,0.85)', color: '#000', duration: 0.1 }, wStart);
          });

          tl.to('#' + c.id, { opacity: 0, duration: 0.22 }, c.start + totalDur - 0.22);
