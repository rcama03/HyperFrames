        window.__timelines = window.__timelines || {};

        /* ────────────────────────────────────────────────────────────
           HELPER: each overlay is exactly 3 seconds
           enter 0.45s | hold | exit 0.45s
        ──────────────────────────────────────────────────────────── */

        /* ── 1. INTRO CARD  2s → 5s  (3D flip down from top) ─────── */
        tl.to('#intro-card', {
          opacity: 1,
          rotateX: 0,
          scale: 1,
          duration: 0.5,
          ease: 'back.out(1.6)'
        }, 2);
        tl.to('#intro-card .intro-rule', {
          width: 60,
          duration: 0.4,
          ease: 'power2.out'
        }, 2.45);
        tl.to('#intro-card', {
          opacity: 0,
          rotateX: 90,
          scale: 0.85,
          duration: 0.45,
          ease: 'power2.in'
        }, 4.55);

        /* ── 2. LOWER THIRD  17s → 20s  (blur + slide up) ────────── */
        tl.to('#lt-hub', {
          opacity: 1,
          filter: 'blur(0px)',
          y: 0,
          duration: 0.5,
          ease: 'power3.out'
        }, 17);
        tl.to('#lt-hub', {
          opacity: 0,
          filter: 'blur(10px)',
          y: 20,
          duration: 0.45,
          ease: 'power2.in'
        }, 19.55);

        /* ── 3. STAT PILL  38s → 41s  (elastic scale bounce) ─────── */
        tl.to('#stat-security', {
          opacity: 1,
          scale: 1,
          duration: 0.55,
          ease: 'elastic.out(1, 0.5)'
        }, 38);
        /* glow pulse while visible */
        tl.to('#stat-security', {
          boxShadow: '0 0 40px rgba(245,158,11,0.6), 0 8px 32px rgba(0,0,0,0.45)',
          duration: 0.3,
          yoyo: true,
          repeat: 2,
          ease: 'power1.inOut'
        }, 38.6);
        tl.to('#stat-security', {
          opacity: 0,
          scale: 0,
          duration: 0.4,
          ease: 'back.in(1.8)'
        }, 40.6);

        /* ── 4. WARNING CARD  62s → 65s  (zoom + shake) ──────────── */
        tl.to('#warning-peak', {
          opacity: 1,
          scale: 1,
          duration: 0.4,
          ease: 'back.out(2)'
        }, 62);
        /* horizontal shake */
        tl.to('#warning-peak', {
          x: -6, duration: 0.06, ease: 'none', yoyo: true, repeat: 5
        }, 62.45);
        tl.to('#warning-peak', { x: 0, duration: 0.04 }, 62.82);
        tl.to('#warning-peak', {
          opacity: 0,
          scale: 0.7,
          rotation: -5,
          duration: 0.45,
          ease: 'power3.in'
        }, 64.55);

        /* ── 5. TIP #1  92s → 95s  (clip-path wipe + slide) ─────── */
        tl.to('#tip-1', {
          opacity: 1,
          x: 0,
          'clip-path': 'inset(0 0% 0 0)',
          duration: 0.5,
          ease: 'power2.out'
        }, 92);
        tl.to('#tip-1', {
          opacity: 0,
          x: -40,
          'clip-path': 'inset(0 100% 0 0)',
          duration: 0.45,
          ease: 'power2.in'
        }, 94.55);

        /* ── 6. TIMELINE GRAPHIC  128s → 131s  (scale + dot reveal) ─ */
        tl.to('#timeline-graphic', {
          opacity: 1,
          scaleX: 1,
          duration: 0.45,
          ease: 'power2.out'
        }, 128);
        tl.to('.tg-step', {
          opacity: 1,
          y: 0,
          duration: 0.25,
          stagger: 0.12,
          ease: 'back.out(1.7)'
        }, 128.4);
        tl.to('.tg-fill', {
          width: '100%',
          duration: 0.3,
          stagger: 0.18,
          ease: 'power1.inOut'
        }, 128.5);
        tl.to('#timeline-graphic', {
          opacity: 0,
          scaleX: 0,
          duration: 0.4,
          ease: 'power2.in'
        }, 130.6);

        /* ── 7. TIP #2  156s → 159s  (rotateY card flip) ─────────── */
        tl.to('#tip-2', {
          opacity: 1,
          rotateY: 0,
          duration: 0.55,
          ease: 'power3.out'
        }, 156);
        tl.to('#tip-2', {
          opacity: 0,
          rotateY: 90,
          duration: 0.45,
          ease: 'power2.in'
        }, 158.55);

        /* ── 8. STAT BAR  185s → 188s  (staggered metric pop) ────── */
        tl.to('#stat-bar', {
          opacity: 1,
          y: 0,
          duration: 0.4,
          ease: 'power2.out'
        }, 185);
        tl.to('.sb-metric', {
          opacity: 1,
          y: 0,
          scale: 1,
          duration: 0.3,
          stagger: 0.1,
          ease: 'back.out(2)'
        }, 185.35);
        tl.to('#stat-bar', {
          opacity: 0,
          y: 20,
          duration: 0.4,
          ease: 'power2.in'
        }, 187.6);

        /* ── 9. CTA BAR  212s → 215s  (elastic bounce from bottom) ─ */
        tl.fromTo('#cta-bar',
          { opacity: 0, y: 72, visibility: 'visible' },
          { opacity: 1, y: 0, visibility: 'visible', duration: 0.6, ease: 'elastic.out(1, 0.6)' },
          212
        );
        tl.to('#cta-check', {
          opacity: 1,
          scale: 1,
          duration: 0.35,
          ease: 'back.out(2.5)'
        }, 212.7);
