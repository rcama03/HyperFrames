<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frankfurt Airport — Motion Graphics Overlay</title>
  <script src="gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #000;
    }

    #stage {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
    }

    #a-roll {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      object-fit: cover;
    }

    .overlay-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"
       data-composition-id="frankfurt-airport"
       data-width="1280"
       data-height="720"
       data-duration="222.8">

    <!-- A-Roll: the source video, full-frame -->
    <video id="a-roll"
           src="video.mp4"
           data-start="0"
           data-duration="222.8"
           data-track-index="0"
           muted
           playsinline>
    </video>

    <!-- Motion graphics overlay -->
    <div class="overlay-layer"
         data-composition-id="overlays"
         data-composition-src="compositions/overlays.html"
         data-start="0"
         data-duration="222.8"
         data-track-index="1">
    </div>

    <script>
      // Main timeline: video stays full-frame, no repositioning needed
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["frankfurt-airport"] = tl;
    </script>
  </div>
</body>
</html>
