<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Reise Insider — Subscribe Card</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:transparent;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
  canvas{display:block}
  #btn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.5);
    color:#00ccff;font:600 12px 'Courier New',monospace;letter-spacing:5px;
    padding:12px 36px;cursor:pointer;text-transform:uppercase;z-index:9}
  #btn:hover{background:rgba(0,200,255,.22);box-shadow:0 0 24px rgba(0,200,255,.4)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="btn">&#9654; PLAY</button>
<script>
/* =================================================
   REISE INSIDER — Subscribe Card  (~8 seconds)
   Glassmorphic · hand-animated · aviation theme
   ================================================= */

var W=1920, H=1080;
var cv=document.getElementById('c');
var g=cv.getContext('2d');
cv.width=W; cv.height=H;
function fit(){var s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
fit(); addEventListener('resize',fit);

// ── easing ───────────────────────────────────────
function cl(v){return v<0?0:v>1?1:v;}
function rmp(v,a,b){return cl((v-a)/(b-a));}
function eoe(t){return t>=1?1:1-Math.pow(2,-10*t);}
function eio(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}

// ── rounded rect helper (no roundRect API needed) ─
function rrect(x,y,w,h,r){
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,   x+w,y+h, r);
  g.arcTo(x+w,y+h, x,  y+h, r);
  g.arcTo(x,  y+h, x,  y,   r);
  g.arcTo(x,  y,   x+w,y,   r);
  g.closePath();
}

// ── layout constants ─────────────────────────────
var CX=960, CY=580;         // card centre
var CW=960, CH=190;         // card size
var LX=CX-CW/2+108;        // logo centre X
var SX=CX, SW=230, SH=74;     // subscribe button (centre)
var LKX=CX-220, BLX=CX+220;  // like (LEFT of subscribe) / bell centres — equal gaps
var BR=46;                   // like/bell radius
var CL=CX-CW/2;             // card left edge (fixed)
var CR=BLX+BR+50;           // card right edge — 50px after bell

// ── stars ────────────────────────────────────────
var rng=42;
function rnd(){rng=(rng*1664525+1013904223)&0xffffffff;return(rng>>>0)/0xffffffff;}
var STARS=[];
for(var i=0;i<220;i++) STARS.push({x:rnd()*W,y:rnd()*H,r:rnd()*1.6+0.3,a:rnd()*0.45+0.08});

// ── ripples ──────────────────────────────────────
var ripples=[];
function addRipple(x,y,col){ripples.push({x:x,y:y,r:4,maxR:90,col:col,a:1});}

// ── one-shot flags ────────────────────────────────
var did={sub:false,like:false,bell:false};

// ── audio ────────────────────────────────────────
function audio(){
  var A=window.AudioContext||window.webkitAudioContext; if(!A) return;
  var ac=new A(), t=ac.currentTime;
  var out=ac.createGain();
  out.gain.setValueAtTime(0.9,t);
  out.gain.setValueAtTime(0.9,t+7.4);
  out.gain.linearRampToValueAtTime(0,t+8.2);
  out.connect(ac.destination);

  function click(st,freq,vol){
    var o=ac.createOscillator(),gn=ac.createGain();
    o.type='sine';o.frequency.value=freq;
    gn.gain.setValueAtTime(vol,st);gn.gain.exponentialRampToValueAtTime(0.001,st+0.14);
    o.connect(gn);gn.connect(out);o.start(st);o.stop(st+0.16);
  }
  function crack(st,vol){
    var buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*0.09),ac.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*0.03));
    var src=ac.createBufferSource(),gn=ac.createGain();
    gn.gain.setValueAtTime(vol,st);gn.gain.exponentialRampToValueAtTime(0.001,st+0.09);
    src.buffer=buf;src.connect(gn);gn.connect(out);src.start(st);
  }
  function chime(st,freqs,vol){
    freqs.forEach(function(f,i){
      var o=ac.createOscillator(),gn=ac.createGain();
      o.type='sine';o.frequency.value=f;
      gn.gain.setValueAtTime(0,st+i*0.06);
      gn.gain.linearRampToValueAtTime(vol,st+i*0.06+0.02);
      gn.gain.exponentialRampToValueAtTime(0.001,st+i*0.06+1.1);
      o.connect(gn);gn.connect(out);o.start(st+i*0.06);o.stop(st+i*0.06+1.2);
    });
  }

  // SUBSCRIBE click — dramatic
  crack(t+2.0,1.0); click(t+2.0,180,0.45);
  chime(t+2.06,[523,659,784,1047],0.13);

  // LIKE click — lighter, higher
  crack(t+3.3,0.55); click(t+3.3,300,0.28);
  chime(t+3.35,[880,1108],0.09);

  // BELL click — bell ring
  crack(t+4.5,0.45);
  chime(t+4.5,[880,1108,1318,1760],0.11);
}

// ── mini logo ────────────────────────────────────
function drawLogo(cx,cy,ro,alpha){
  var ri=ro*0.59, rt=(ro+ri)/2;
  g.save(); g.globalAlpha=alpha;

  // outer fill
  g.beginPath(); g.arc(cx,cy,ro,0,Math.PI*2);
  g.fillStyle='rgba(8,16,32,0.88)'; g.fill();

  // outer ring glow layers
  g.save();
  g.shadowColor='#ffd700'; g.shadowBlur=16;
  var og=g.createLinearGradient(cx-ro,cy,cx+ro,cy);
  og.addColorStop(0,'#00ccff'); og.addColorStop(0.45,'#ffd700');
  og.addColorStop(0.55,'#ffd700'); og.addColorStop(1,'#00ccff');
  g.beginPath(); g.arc(cx,cy,ro,0,Math.PI*2);
  g.strokeStyle=og; g.lineWidth=4; g.stroke();
  g.restore();

  // REISE letters — top arc
  g.save();
  g.shadowColor='#00aaff'; g.shadowBlur=8;
  g.font='900 '+(ro*0.195)+'px "Arial Black",Arial,sans-serif';
  g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#ffffff';
  var word='REISE', totalA=(word.length-1)*0.295, startA=-Math.PI/2-totalA/2;
  for(var i=0;i<word.length;i++){
    var th=startA+i*0.295;
    var px=cx+rt*Math.cos(th), py=cy+rt*Math.sin(th);
    g.save(); g.translate(px,py); g.rotate(th+Math.PI/2);
    g.fillText(word[i],0,0); g.restore();
  }
  g.restore();

  // INSIDER letters — bottom arc (decreasing theta = L→R from viewer)
  g.save();
  g.shadowColor='#ffaa00'; g.shadowBlur=8;
  g.font='900 '+(ro*0.175)+'px "Arial Black",Arial,sans-serif';
  g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#ffd700';
  var word2='INSIDER', totalA2=(word2.length-1)*0.25, startA2=Math.PI/2+totalA2/2;
  for(var i=0;i<word2.length;i++){
    var th=startA2-i*0.25;
    var px=cx+rt*Math.cos(th), py=cy+rt*Math.sin(th);
    g.save(); g.translate(px,py); g.rotate(th-Math.PI/2);
    g.fillText(word2[i],0,0); g.restore();
  }
  g.restore();

  // diamond separators
  [[cx+rt,cy],[cx-rt,cy]].forEach(function(p){
    g.save(); g.translate(p[0],p[1]);
    g.beginPath(); g.moveTo(0,-4); g.lineTo(4,0); g.lineTo(0,4); g.lineTo(-4,0); g.closePath();
    g.fillStyle='#ffd700'; g.fill(); g.restore();
  });

  // inner ring
  g.save();
  g.shadowColor='#00ccff'; g.shadowBlur=18;
  g.beginPath(); g.arc(cx,cy,ri,0,Math.PI*2);
  g.fillStyle='rgba(5,10,22,0.9)'; g.fill();
  g.strokeStyle='#00ccff'; g.lineWidth=3; g.stroke();
  g.restore();

  // aircraft — same proportion as final logo (sc/RI = 5.5/160)
  var sc=ri*0.034;
  g.save(); g.translate(cx,cy); g.rotate(-Math.PI/16); g.scale(sc,sc);
  g.shadowColor='#0055ff'; g.shadowBlur=22; g.fillStyle='#ffffff';
  g.beginPath(); g.moveTo(22,0); g.lineTo(-16,-5); g.lineTo(-16,5); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(4,0); g.lineTo(-10,-26); g.lineTo(-16,-5); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(4,0); g.lineTo(-10,26);  g.lineTo(-16,5);  g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-16,-5); g.lineTo(-24,-14); g.lineTo(-20,0); g.lineTo(-24,14); g.lineTo(-16,5); g.closePath(); g.fill();
  g.restore();

  g.restore();
}

// ── hand cursor — classic browser pointer shape ──
function drawHand(x,y,clicking){
  g.save();
  g.translate(x, y + (clicking?4:0));
  if(clicking) g.scale(0.93,0.93);
  g.shadowColor='rgba(0,0,0,0.6)'; g.shadowBlur=12;
  g.shadowOffsetX=3; g.shadowOffsetY=5;
  g.fillStyle='#ffffff';
  g.strokeStyle='rgba(20,20,20,0.7)'; g.lineWidth=2;
  g.lineJoin='round'; g.lineCap='round';

  // Single path: tip at top, clockwise around entire hand
  g.beginPath();
  // Index fingertip (arc at top)
  g.moveTo(-8,-56);
  g.arc(0,-56,8,Math.PI,0);       // rounded tip
  // Right side of index finger down
  g.lineTo(8,-20);
  // Middle finger knuckle bump
  g.bezierCurveTo(8,-30, 21,-30, 21,-20);
  g.lineTo(21,-14);
  // Ring finger knuckle bump
  g.bezierCurveTo(21,-23, 34,-23, 34,-12);
  g.lineTo(34,-5);
  // Pinky knuckle bump
  g.bezierCurveTo(34,-15, 46,-15, 46,-3);
  // Palm right edge down
  g.lineTo(46,30);
  g.quadraticCurveTo(46,42, 33,42);
  // Palm bottom
  g.lineTo(-3,42);
  g.quadraticCurveTo(-14,42, -14,30);
  // Thumb on left side
  g.lineTo(-14,15);
  g.bezierCurveTo(-14,5, -26,1, -24,-7);
  g.bezierCurveTo(-22,-15, -11,-13, -8,-20);
  // Left side of index finger back to tip
  g.lineTo(-8,-56);
  g.closePath();
  g.fill(); g.stroke();

  // Subtle knuckle crease on index finger
  g.beginPath(); g.moveTo(-6,-38); g.lineTo(6,-38);
  g.strokeStyle='rgba(0,0,0,0.1)'; g.lineWidth=1.5; g.stroke();

  g.restore();
}

// ── state ────────────────────────────────────────
var T0=null, rafId=null;
var hx=BLX+60, hy=CY+280; // hand starts bottom-right

function draw(ts){
  if(!T0) T0=ts;
  var T=(ts-T0)/1000;

  // one-shot ripples
  if(T>2.0  && !did.sub)  { addRipple(SX,CY,'#ff4444');  did.sub=true;  }
  if(T>3.3  && !did.like) { addRipple(LKX,CY,'#00ccff'); did.like=true; }
  if(T>4.5  && !did.bell) { addRipple(BLX,CY,'#ffd700'); did.bell=true; }

  // button activation progress
  var subA  = eoe(rmp(T,2.0,2.6));
  var likeA = eoe(rmp(T,3.3,3.8));
  var bellA = eoe(rmp(T,4.5,5.0));

  // click pulse (scale dip)
  var subPulse  = rmp(T,1.88,2.02)*(1-rmp(T,2.02,2.18));
  var likePulse = rmp(T,3.18,3.32)*(1-rmp(T,3.32,3.48));
  var bellPulse = rmp(T,4.38,4.52)*(1-rmp(T,4.52,4.68));

  // hand target
  var htx, hty=CY+38;
  if(T<0.8)              { htx=BLX+60;  hty=CY+280; }  // idle bottom-right
  else if(T<2.4)         { htx=SX+18;   }               // → subscribe (centre)
  else if(T<3.6)         { htx=LKX+10;  }               // → like (left)
  else                   { htx=BLX+10;  }               // → bell (right)
  hx+=(htx-hx)*0.10; hy+=(hty-hy)*0.10;
  var clicking=(T>1.88&&T<2.18)||(T>3.18&&T<3.48)||(T>4.38&&T<4.68);

  // overall alpha — fade-out baked in so all elements fade together
  var cardA=eoe(rmp(T,0.3,1.1)) * (1-rmp(T,7.4,8.2));

  // transparent canvas each frame
  g.clearRect(0,0,W,H);

  if(cardA<=0){ rafId=requestAnimationFrame(draw); return; }

  // ── GLASS CARD ───────────────────────────────
  g.save(); g.globalAlpha=cardA;

  // wide outer glow
  g.save();
  g.shadowColor='#00ccff'; g.shadowBlur=40;
  g.beginPath(); rrect(CL-6,CY-CH/2-6,CR-CL+12,CH+12,28);
  g.strokeStyle='rgba(0,200,255,0.12)'; g.lineWidth=12; g.stroke();
  g.restore();

  // glass fill — gradient top to bottom
  var gf=g.createLinearGradient(CL,CY-CH/2,CR,CY+CH/2);
  gf.addColorStop(0,'rgba(14,28,55,0.92)');
  gf.addColorStop(1,'rgba(6,12,26,0.95)');
  g.beginPath(); rrect(CL,CY-CH/2,CR-CL,CH,22);
  g.fillStyle=gf; g.fill();

  // glass border — gold→cyan gradient
  var gb=g.createLinearGradient(CL,CY,CR,CY);
  gb.addColorStop(0,'rgba(0,200,255,0.7)');
  gb.addColorStop(0.38,'rgba(255,210,0,0.8)');
  gb.addColorStop(0.62,'rgba(255,210,0,0.8)');
  gb.addColorStop(1,'rgba(0,200,255,0.7)');
  g.save(); g.shadowColor='#ffd700'; g.shadowBlur=14;
  g.beginPath(); rrect(CL,CY-CH/2,CR-CL,CH,22);
  g.strokeStyle=gb; g.lineWidth=2; g.stroke();
  g.restore();

  // inner top shine
  g.beginPath(); rrect(CL+3,CY-CH/2+3,CR-CL-6,6,3);
  g.fillStyle='rgba(255,255,255,0.07)'; g.fill();

  g.restore();

  // ── LOGO ─────────────────────────────────────
  drawLogo(LX, CY, 74, cardA * eoe(rmp(T,0.4,1.1)));

  // divider line
  g.save(); g.globalAlpha=cardA*0.35;
  g.strokeStyle='#00ccff'; g.lineWidth=1; g.setLineDash([3,6]);
  g.beginPath(); g.moveTo(LX+90,CY-62); g.lineTo(LX+90,CY+62); g.stroke();
  g.setLineDash([]); g.restore();

  // ── SUBSCRIBE BUTTON ─────────────────────────
  g.save(); g.globalAlpha=cardA;
  var ss=1-0.09*subPulse;
  g.translate(SX,CY); g.scale(ss,ss); g.translate(-SX,-CY);

  // fill: dark glass → red
  var sf=g.createLinearGradient(SX-SW/2,CY-SH/2,SX+SW/2,CY+SH/2);
  sf.addColorStop(0,'rgba('+(12+220*subA)+','+(6+6*subA)+','+(6+6*subA)+','+(0.2+0.8*subA)+')');
  sf.addColorStop(1,'rgba('+(8+180*subA)+','+(4+4*subA)+','+(4+4*subA)+','+(0.15+0.82*subA)+')');
  g.beginPath(); rrect(SX-SW/2,CY-SH/2,SW,SH,SH/2);
  g.fillStyle=sf; g.fill();

  // glow border
  g.save();
  g.shadowColor=subA>0.5?'#ff3333':'rgba(200,50,50,0.5)';
  g.shadowBlur=8+subA*24;
  g.beginPath(); rrect(SX-SW/2,CY-SH/2,SW,SH,SH/2);
  g.strokeStyle='rgba(220,'+(50+180*(1-subA))+','+(50+180*(1-subA))+',0.75)';
  g.lineWidth=2; g.stroke();
  g.restore();

  // text
  g.textAlign='center'; g.textBaseline='middle';
  g.font='700 22px "Arial Black",Arial,sans-serif';
  g.shadowColor='rgba(255,255,255,0.3)'; g.shadowBlur=subA*8;
  g.fillStyle='#ffffff';
  g.fillText(subA>0.55?'SUBSCRIBED  ✓':'SUBSCRIBE', SX, CY);
  g.restore();

  // ── LIKE BUTTON ──────────────────────────────
  g.save(); g.globalAlpha=cardA;
  var ls=1-0.1*likePulse;
  g.translate(LKX,CY); g.scale(ls,ls); g.translate(-LKX,-CY);

  var lf=g.createRadialGradient(LKX,CY-12,0,LKX,CY,BR);
  lf.addColorStop(0,'rgba('+(8+8*likeA)+','+(20+180*likeA)+','+(30+220*likeA)+','+(0.18+0.82*likeA)+')');
  lf.addColorStop(1,'rgba(4,'+(10+100*likeA)+','+(20+160*likeA)+','+(0.12+0.8*likeA)+')');
  g.beginPath(); g.arc(LKX,CY,BR,0,Math.PI*2);
  g.fillStyle=lf; g.fill();

  g.save();
  g.shadowColor=likeA>0.5?'#00ccff':'rgba(0,150,255,0.5)';
  g.shadowBlur=6+likeA*22;
  g.strokeStyle='rgba(0,'+(160+95*likeA)+',255,0.8)';
  g.lineWidth=2; g.stroke();
  g.restore();

  g.textAlign='center'; g.textBaseline='middle';
  g.font=(BR*0.9)+'px sans-serif';
  g.fillText('👍', LKX, CY+3);  // 👍
  g.restore();

  // ── BELL BUTTON ──────────────────────────────
  g.save(); g.globalAlpha=cardA;
  var bls=1-0.1*bellPulse;
  // shake when activated
  var shake=bellA>0.5?Math.sin(T*32)*(1-rmp(T,5.0,5.8))*5:0;
  g.translate(BLX+shake,CY); g.scale(bls,bls); g.translate(-BLX-shake,-CY);

  var bfg=g.createRadialGradient(BLX,CY-12,0,BLX,CY,BR);
  bfg.addColorStop(0,'rgba('+(12+240*bellA)+','+(12+188*bellA)+',0,'+(0.18+0.82*bellA)+')');
  bfg.addColorStop(1,'rgba('+(8+180*bellA)+','+(8+130*bellA)+',0,'+(0.12+0.8*bellA)+')');
  g.beginPath(); g.arc(BLX,CY,BR,0,Math.PI*2);
  g.fillStyle=bfg; g.fill();

  g.save();
  g.shadowColor=bellA>0.5?'#ffd700':'rgba(255,180,0,0.5)';
  g.shadowBlur=6+bellA*22;
  g.strokeStyle='rgba(255,'+(180+75*bellA)+',0,0.8)';
  g.lineWidth=2; g.stroke();
  g.restore();

  g.textAlign='center'; g.textBaseline='middle';
  g.font=(BR*0.9)+'px sans-serif';
  g.fillText('🔔', BLX, CY+2);  // 🔔
  g.restore();

  // ── RIPPLES ──────────────────────────────────
  for(var i=0;i<ripples.length;i++){
    var rp=ripples[i];
    rp.r+=(rp.maxR-rp.r)*0.11; rp.a-=0.022;
    if(rp.a<0) continue;
    g.beginPath(); g.arc(rp.x,rp.y,rp.r,0,Math.PI*2);
    g.strokeStyle=rp.col; g.globalAlpha=rp.a*0.55;
    g.lineWidth=2.5; g.stroke(); g.globalAlpha=1;
  }
  ripples=ripples.filter(function(r){return r.a>0;});

  // ── HAND CURSOR — fades out after bell click ─
  var handA = cardA * cl(1 - rmp(T, 5.1, 5.9));
  if(handA > 0.01){ g.globalAlpha=handA; drawHand(hx,hy,clicking); g.globalAlpha=1; }


  if(T<8.5) rafId=requestAnimationFrame(draw);
}

g.clearRect(0,0,W,H);

document.getElementById('btn').addEventListener('click',function(){
  this.style.display='none';
  ripples=[]; did={sub:false,like:false,bell:false};
  hx=BLX+60; hy=CY+280;
  audio(); T0=null;
  if(rafId) cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(draw);
});
</script>
</body>
</html>
