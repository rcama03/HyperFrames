<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Reise Insider — Sting</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
  canvas{display:block}
  #btn{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.5);
    color:#00ccff;font:600 12px 'Courier New',monospace;letter-spacing:5px;
    padding:12px 36px;cursor:pointer;text-transform:uppercase;z-index:9
  }
  #btn:hover{background:rgba(0,200,255,.22);box-shadow:0 0 24px rgba(0,200,255,.4)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="btn">&#9654; PLAY</button>
<script>
/* =====================================================
   REISE INSIDER — Channel Sting  (~5 s)
   Plane always in BG. Words slide in one by one.
   ===================================================== */

var W = 1920, H = 1080;
var cv = document.getElementById('c');
var g  = cv.getContext('2d');
cv.width = W; cv.height = H;

function fit() {
  var s = Math.min(innerWidth/W, innerHeight/H);
  cv.style.width = W*s+'px'; cv.style.height = H*s+'px';
}
fit(); window.addEventListener('resize', fit);

// ── easing ───────────────────────────────────────────
function cl(v)  { return v < 0 ? 0 : v > 1 ? 1 : v; }
function rmp(v,a,b) { return cl((v-a)/(b-a)); }
function eoe(t) { return t >= 1 ? 1 : 1 - Math.pow(2, -10*t); }   // out-expo
function eos(t) {                                                    // out-elastic (slam+settle)
  if (t <= 0) return 0; if (t >= 1) return 1;
  return Math.pow(2, -9*t) * Math.sin((t*10 - 0.75) * (2*Math.PI/3)) + 1;
}

// ── word definitions ─────────────────────────────────
//  tx,ty = final position   dx,dy = slide-in offset (fades to 0)
//  t0 = start time   dur = slide duration
var WORDS = [
  {
    text:'REISE',
    tx:W/2, ty:H/2-118,
    dx:-240, dy:0,
    t0:0.5,  dur:0.42,
    font:'900 148px "Arial Black",Arial,sans-serif',
    col:'#ffffff', glow:'#00ccff', glowB:60
  },
  {
    text:'INSIDER',
    tx:W/2, ty:H/2+60,
    dx:240,  dy:0,
    t0:1.15, dur:0.42,
    font:'900 148px "Arial Black",Arial,sans-serif',
    col:'#ffd700', glow:'#ffaa00', glowB:70
  },
  {
    text:'AVIATION',
    tx:W/2-255, ty:H/2+218,
    dx:-160, dy:0,
    t0:1.9,  dur:0.38,
    font:'900 32px "Arial Black",Arial,sans-serif',
    col:'#ffffff', glow:'#00ccff', glowB:14
  },
  {
    text:'STORIES',
    tx:W/2,     ty:H/2+218,
    dx:0,    dy:90,
    t0:2.55, dur:0.38,
    font:'900 32px "Arial Black",Arial,sans-serif',
    col:'#ffffff', glow:'#00ccff', glowB:14
  },
  {
    text:'INSIGHTS',
    tx:W/2+255, ty:H/2+218,
    dx:160,  dy:0,
    t0:3.2,  dur:0.38,
    font:'900 32px "Arial Black",Arial,sans-serif',
    col:'#ffffff', glow:'#00ccff', glowB:14
  }
];

// ── particles ────────────────────────────────────────
var parts = [];
function burst(px, py, n, spd, col) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var s = (Math.random() * 0.7 + 0.3) * spd;
    parts.push({
      x:px, y:py, vx:Math.cos(a)*s, vy:Math.sin(a)*s,
      life:1, dec:Math.random()*0.024+0.014,
      r:Math.random()*3+0.8, col:col
    });
  }
}

// ── shockwaves ───────────────────────────────────────
var waves = [];
function wave(px, py, col, maxR) {
  waves.push({ x:px, y:py, r:0, max:maxR||450, col:col, a:1 });
}

// ── background plane (always drawn once visible) ─────
function bgPlane(alpha) {
  g.save();
  g.globalAlpha = alpha;
  g.translate(W/2, H/2 - 30);
  g.rotate(-Math.PI / 16);  // slight nose-up
  g.scale(7, 7);
  g.shadowColor = '#0055ff';
  g.shadowBlur  = 60;
  g.fillStyle   = '#ffffff';
  // fuselage
  g.beginPath();
  g.moveTo(22, 0); g.lineTo(-16, -5); g.lineTo(-16, 5);
  g.closePath(); g.fill();
  // left wing
  g.beginPath();
  g.moveTo(4, 0); g.lineTo(-10, -26); g.lineTo(-16, -5);
  g.closePath(); g.fill();
  // right wing
  g.beginPath();
  g.moveTo(4, 0); g.lineTo(-10, 26); g.lineTo(-16, 5);
  g.closePath(); g.fill();
  // tail fin
  g.beginPath();
  g.moveTo(-16, -5); g.lineTo(-24, -14); g.lineTo(-20, 0);
  g.lineTo(-24, 14); g.lineTo(-16, 5);
  g.closePath(); g.fill();
  g.restore();
}

// ── audio ────────────────────────────────────────────
function audio() {
  var A = window.AudioContext || window.webkitAudioContext;
  if (!A) return;
  var ac = new A(), t = ac.currentTime;
  var out = ac.createGain();
  out.gain.setValueAtTime(1, t);
  out.gain.setValueAtTime(1, t + 4.4);
  out.gain.linearRampToValueAtTime(0, t + 5.1);
  out.connect(ac.destination);

  function boom(freq, vol, st, dur) {
    var o=ac.createOscillator(), f=ac.createBiquadFilter(), gn=ac.createGain();
    f.type='lowpass'; f.frequency.value=300;
    o.type='sine';
    o.frequency.setValueAtTime(freq, st);
    o.frequency.exponentialRampToValueAtTime(freq*0.4, st+dur);
    gn.gain.setValueAtTime(0, st);
    gn.gain.linearRampToValueAtTime(vol, st+0.02);
    gn.gain.exponentialRampToValueAtTime(0.001, st+dur);
    o.connect(f); f.connect(gn); gn.connect(out);
    o.start(st); o.stop(st+dur+0.05);
  }

  function ping(st, freq, vol, dur) {
    var o=ac.createOscillator(), gn=ac.createGain();
    o.type='sine'; o.frequency.value=freq;
    gn.gain.setValueAtTime(vol, st);
    gn.gain.exponentialRampToValueAtTime(0.001, st+dur);
    o.connect(gn); gn.connect(out);
    o.start(st); o.stop(st+dur+0.05);
  }

  function whoosh(st, f0, f1, dur) {
    var o=ac.createOscillator(), bf=ac.createBiquadFilter(), gn=ac.createGain();
    bf.type='bandpass'; bf.Q.value=5;
    o.type='sawtooth';
    o.frequency.setValueAtTime(f0, st);
    o.frequency.exponentialRampToValueAtTime(f1, st+dur);
    bf.frequency.setValueAtTime(f0, st);
    bf.frequency.exponentialRampToValueAtTime(f1, st+dur);
    gn.gain.setValueAtTime(0, st);
    gn.gain.linearRampToValueAtTime(0.16, st+dur*0.5);
    gn.gain.linearRampToValueAtTime(0, st+dur);
    o.connect(bf); bf.connect(gn); gn.connect(out);
    o.start(st); o.stop(st+dur+0.05);
  }

  function crack(st, dur, vol) {
    var buf=ac.createBuffer(1, Math.ceil(ac.sampleRate*dur), ac.sampleRate);
    var d=buf.getChannelData(0);
    for (var i=0; i<d.length; i++)
      d[i] = (Math.random()*2-1) * Math.exp(-i/(ac.sampleRate*dur*0.2));
    var src=ac.createBufferSource(), gn=ac.createGain(), f=ac.createBiquadFilter();
    f.type='lowpass'; f.frequency.value=280;
    gn.gain.setValueAtTime(vol, st);
    gn.gain.exponentialRampToValueAtTime(0.001, st+dur);
    src.buffer=buf; src.connect(f); f.connect(gn); gn.connect(out);
    src.start(st);
  }

  // opening hit
  crack(t+0.04, 0.3, 2.0);
  boom(75, 1.2, t+0.04, 0.6);
  ping(t+0.06, 880, 0.2, 0.6);

  // per-word sounds  [land time, whoosh f0, whoosh f1, boom freq, boom vol, ping freq]
  var WS = [
    [0.50,  180, 1400, 70,  1.1, 1320],
    [1.15,  200, 1600, 60,  1.3, 1760],
    [1.90,  150, 1000, 90,  0.6,  880],
    [2.55,  160, 1100, 85,  0.55,1046],
    [3.20,  170, 1200, 80,  0.6, 1174]
  ];
  WS.forEach(function(w) {
    var wt=w[0], f0=w[1], f1=w[2], bf=w[3], bv=w[4], pf=w[5];
    whoosh(t + wt - 0.28, f0, f1, 0.3);
    crack(t + wt, 0.22, wt < 1.5 ? 1.5 : 0.9);
    boom(bf, bv, t + wt, 0.4);
    ping(t + wt + 0.02, pf, wt < 1.5 ? 0.22 : 0.14, 0.9);
  });
}

// ── state ────────────────────────────────────────────
var T0 = null, raf = null;
var did = [false, false, false, false, false];

function draw(ts) {
  if (!T0) T0 = ts;
  var T = (ts - T0) / 1000;

  // word-landing one-shot bursts
  for (var i = 0; i < WORDS.length; i++) {
    var w = WORDS[i];
    if (!did[i] && T >= w.t0 + w.dur * 0.55) {
      burst(w.tx, w.ty, i < 2 ? 90 : 45, i < 2 ? 15 : 9,
            i === 1 ? '#ffd700' : '#00ccff');
      wave(w.tx, w.ty, i === 1 ? '#ffd700' : '#00ccff', i < 2 ? 420 : 260);
      did[i] = true;
    }
  }

  // ── background ─────────────────────────────────
  var bg = g.createRadialGradient(W/2, H/2, 0, W/2, H/2, H*0.75);
  bg.addColorStop(0, '#0a101e');
  bg.addColorStop(1, '#020408');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // ── opening flash ───────────────────────────────
  var fl = rmp(T, 0, 0.1) * (1 - rmp(T, 0.1, 0.4));
  if (fl > 0) { g.fillStyle='rgba(255,255,255,'+fl*0.9+')'; g.fillRect(0,0,W,H); }

  // ── background plane (always visible after fade-in) ──
  var pa = eoe(rmp(T, 0.08, 0.65));
  if (pa > 0) bgPlane(pa * 0.12);

  // ── radar sweep ────────────────────────────────
  var ra = eoe(rmp(T, 0.1, 0.9));
  if (ra > 0) {
    var rcx = W/2, rcy = H/2, rmax = Math.min(W,H) * 0.42;
    var sweepA = (T * 1.3) % (Math.PI * 2);
    // concentric rings
    g.save();
    g.globalAlpha = ra * 0.18;
    g.strokeStyle = '#00c8ff'; g.lineWidth = 0.8;
    [0.25, 0.5, 0.75, 1.0].forEach(function(f) {
      g.beginPath(); g.arc(rcx, rcy, rmax*f, 0, Math.PI*2); g.stroke();
    });
    // crosshairs
    g.globalAlpha = ra * 0.1;
    g.strokeStyle = '#00c8ff'; g.lineWidth = 0.5;
    g.beginPath(); g.moveTo(rcx-rmax, rcy); g.lineTo(rcx+rmax, rcy); g.stroke();
    g.beginPath(); g.moveTo(rcx, rcy-rmax); g.lineTo(rcx, rcy+rmax); g.stroke();
    g.restore();
    // sweep wedge
    g.save();
    g.translate(rcx, rcy); g.rotate(sweepA);
    for (var sa = 0; sa < Math.PI*0.65; sa += 0.018) {
      var fade = 1 - sa / (Math.PI*0.65);
      g.beginPath(); g.moveTo(0,0);
      g.arc(0, 0, rmax, -sa, -sa+0.02);
      g.closePath();
      g.fillStyle = 'rgba(0,220,130,'+(0.18*fade*ra)+')';
      g.fill();
    }
    g.restore();
    // blips
    var BLIPS = [
      {angle:0.40,dist:0.38}, {angle:1.80,dist:0.65},
      {angle:2.90,dist:0.28}, {angle:4.10,dist:0.55},
      {angle:5.20,dist:0.72}, {angle:0.90,dist:0.82}
    ];
    for (var bi = 0; bi < BLIPS.length; bi++) {
      var b = BLIPS[bi];
      var bx = rcx + Math.cos(b.angle)*rmax*b.dist;
      var by = rcy + Math.sin(b.angle)*rmax*b.dist;
      var diff = ((sweepA - b.angle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
      var ba = Math.max(0, 1 - diff/(Math.PI*0.5)) * ra;
      if (ba > 0.01) {
        var bgr2 = g.createRadialGradient(bx,by,0, bx,by,14);
        bgr2.addColorStop(0, 'rgba(0,255,160,'+ba+')');
        bgr2.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = bgr2;
        g.beginPath(); g.arc(bx,by,14,0,Math.PI*2); g.fill();
        g.beginPath(); g.arc(bx,by,3,0,Math.PI*2);
        g.fillStyle = 'rgba(0,255,180,'+ba+')'; g.fill();
      }
    }
  }

  // ── shockwaves ─────────────────────────────────
  for (var i = 0; i < waves.length; i++) {
    var wv = waves[i];
    wv.r += (wv.max - wv.r) * 0.1;
    wv.a -= 0.032;
    if (wv.a < 0) continue;
    g.beginPath(); g.arc(wv.x, wv.y, wv.r, 0, Math.PI*2);
    g.strokeStyle = wv.col;
    g.globalAlpha = wv.a * 0.7;
    g.lineWidth   = Math.max(1, 3*wv.a);
    g.stroke(); g.globalAlpha = 1;
  }
  waves = waves.filter(function(w) { return w.a > 0; });

  // ── particles ──────────────────────────────────
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.96; p.vy *= 0.96;
    p.life -= p.dec;
    if (p.life <= 0) continue;
    g.beginPath(); g.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2);
    g.fillStyle   = p.col;
    g.globalAlpha = p.life * 0.85;
    g.shadowColor = p.col; g.shadowBlur = p.r * 5;
    g.fill(); g.shadowBlur = 0; g.globalAlpha = 1;
  }
  parts = parts.filter(function(p) { return p.life > 0; });

  // ── words ──────────────────────────────────────
  g.save();
  g.textAlign    = 'center';
  g.textBaseline = 'middle';

  for (var i = 0; i < WORDS.length; i++) {
    var w  = WORDS[i];
    var wt = rmp(T, w.t0, w.t0 + w.dur);
    if (wt <= 0) continue;

    var we    = eos(wt);             // elastic position
    var alpha = cl(wt * 2.5);       // quick fade-in
    var ox    = w.dx * (1 - we);    // slide offset X
    var oy    = w.dy * (1 - we);    // slide offset Y

    // brief white flash as word lands
    var wf = rmp(T, w.t0+w.dur*0.5, w.t0+w.dur*0.65)
           * (1 - rmp(T, w.t0+w.dur*0.65, w.t0+w.dur*0.9));

    g.globalAlpha = alpha;
    g.font        = w.font;

    if (wf > 0.02) {
      g.shadowColor = '#ffffff';
      g.shadowBlur  = 70 * wf;
    } else {
      g.shadowColor = w.glow;
      g.shadowBlur  = w.glowB * cl(alpha);
    }

    g.fillStyle = w.col;
    g.fillText(w.text, w.tx + ox, w.ty + oy);
  }

  g.restore();

  // ── divider line between REISE and INSIDER ─────
  var ml = eoe(rmp(T, 1.15 + 0.42*0.7, 1.15 + 0.42));
  if (ml > 0) {
    var mlw = ml * 360;
    g.globalAlpha = ml * 0.7;
    g.strokeStyle = '#ffd700'; g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(W/2 - mlw, H/2 - 29);
    g.lineTo(W/2 + mlw, H/2 - 29);
    g.stroke();
    g.globalAlpha = 1;
  }

  // ── gold divider line (appears with AVIATION) ───
  var dl = eoe(rmp(T, 1.9, 2.25));
  if (dl > 0) {
    var dlw = dl * 400;
    g.globalAlpha = dl * 0.55;
    g.strokeStyle = '#ffd700'; g.lineWidth = 1.2;
    g.beginPath();
    g.moveTo(W/2 - dlw, H/2 + 148);
    g.lineTo(W/2 + dlw, H/2 + 148);
    g.stroke();
    g.globalAlpha = 1;
  }

  // ── film grain ─────────────────────────────────
  g.save(); g.globalAlpha = 0.04;
  for (var i = 0; i < 900; i++) {
    var v = Math.random() * 255 | 0;
    g.fillStyle = 'rgb('+v+','+v+','+v+')';
    g.fillRect(Math.random()*W|0, Math.random()*H|0, 2, 2);
  }
  g.restore();

  // ── vignette ───────────────────────────────────
  var vg = g.createRadialGradient(W/2, H/2, H*0.18, W/2, H/2, H*0.82);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.8)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  // ── fade in ────────────────────────────────────
  var fi = 1 - rmp(T, 0, 0.08);
  if (fi > 0) { g.fillStyle='rgba(0,0,0,'+fi+')'; g.fillRect(0,0,W,H); }

  // ── fade out ───────────────────────────────────
  var fo = rmp(T, 4.5, 5.2);
  if (fo > 0) { g.fillStyle='rgba(0,0,0,'+fo+')'; g.fillRect(0,0,W,H); }

  if (T < 5.5) raf = requestAnimationFrame(draw);
}

// preview frame
g.fillStyle = '#060b14'; g.fillRect(0, 0, W, H);

document.getElementById('btn').addEventListener('click', function() {
  this.style.display = 'none';
  parts = []; waves = [];
  did = [false, false, false, false, false];
  audio();
  T0 = null;
  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(draw);
});
</script>
</body>
</html>
