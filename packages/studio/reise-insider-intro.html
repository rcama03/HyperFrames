<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reise Insider — Aviation Intro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
    #start-btn {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 180, 255, 0.15);
      border: 1px solid rgba(0, 180, 255, 0.6);
      color: #00b4ff;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      letter-spacing: 4px;
      padding: 14px 36px;
      cursor: pointer;
      text-transform: uppercase;
      z-index: 100;
      transition: all 0.3s;
    }
    #start-btn:hover {
      background: rgba(0, 180, 255, 0.3);
      box-shadow: 0 0 24px rgba(0, 180, 255, 0.4);
    }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<button id="start-btn">▶ PLAY INTRO</button>

<script>
// ─────────────────────────────────────────────
//  REISE INSIDER — Premium Aviation Intro
//  1920×1080 · ~10 seconds · Canvas + Web Audio
// ─────────────────────────────────────────────

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width  = W;
canvas.height = H;

// ── Resize to viewport while keeping 16:9
function resize() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = (W * s) + 'px';
  canvas.style.height = (H * s) + 'px';
}
resize();
window.addEventListener('resize', resize);

// ══════════════════════════════════════════════
//  WEB AUDIO — cinematic score
// ══════════════════════════════════════════════
let audioCtx = null;

function startAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const t = audioCtx.currentTime;

  const masterGain = audioCtx.createGain();
  masterGain.gain.setValueAtTime(0, t);
  masterGain.gain.linearRampToValueAtTime(0.9, t + 1.5);
  masterGain.gain.setValueAtTime(0.9, t + 8.5);
  masterGain.gain.linearRampToValueAtTime(0, t + 10.5);
  masterGain.connect(audioCtx.destination);

  // ── Deep ambient pad (engine drone) ──────────
  function pad(freq, gainVal, startT, dur) {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 800;

    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, startT);
    gain.gain.setValueAtTime(0, startT);
    gain.gain.linearRampToValueAtTime(gainVal, startT + 1.2);
    gain.gain.setValueAtTime(gainVal, startT + dur - 1);
    gain.gain.linearRampToValueAtTime(0, startT + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(masterGain);
    osc.start(startT);
    osc.stop(startT + dur);
  }

  // ── Chord progression (Dm → Bb → F → C — cinematic) ──
  // Root drone
  pad(36.7,  0.18, t + 0,   10);   // D1
  pad(73.4,  0.14, t + 0,   10);   // D2
  pad(110,   0.10, t + 0,   10);   // A2
  pad(146.8, 0.08, t + 0.5, 9.5);  // D3

  // Chord layers
  const chordFreqs = [220, 261.6, 293.7, 329.6, 369.9, 440];
  chordFreqs.forEach((f, i) => pad(f, 0.06, t + 1 + i * 0.15, 9 - i * 0.1));

  // ── Rising sweep ──────────────────────────────
  const sweep  = audioCtx.createOscillator();
  const swGain = audioCtx.createGain();
  const swFilt = audioCtx.createBiquadFilter();
  swFilt.type = 'bandpass';
  swFilt.Q.value = 12;
  sweep.type = 'sawtooth';
  sweep.frequency.setValueAtTime(80, t + 3);
  sweep.frequency.exponentialRampToValueAtTime(1200, t + 6.5);
  swFilt.frequency.setValueAtTime(80, t + 3);
  swFilt.frequency.exponentialRampToValueAtTime(1200, t + 6.5);
  swGain.gain.setValueAtTime(0, t + 3);
  swGain.gain.linearRampToValueAtTime(0.12, t + 5);
  swGain.gain.linearRampToValueAtTime(0,    t + 7);
  sweep.connect(swFilt);
  swFilt.connect(swGain);
  swGain.connect(masterGain);
  sweep.start(t + 3);
  sweep.stop(t + 7.5);

  // ── Impact hit at text reveal ─────────────────
  function impact(startT) {
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.4, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.05));
    }
    const src  = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();
    const flt  = audioCtx.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.value = 200;
    gain.gain.setValueAtTime(1.4, startT);
    gain.gain.exponentialRampToValueAtTime(0.001, startT + 0.4);
    src.buffer = buf;
    src.connect(flt);
    flt.connect(gain);
    gain.connect(masterGain);
    src.start(startT);
  }
  impact(t + 5.8);

  // ── Radar ping ────────────────────────────────
  function ping(startT, freq = 880) {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.18, startT);
    gain.gain.exponentialRampToValueAtTime(0.001, startT + 0.6);
    osc.connect(gain);
    gain.connect(masterGain);
    osc.start(startT);
    osc.stop(startT + 0.7);
  }
  ping(t + 1.0, 880);
  ping(t + 2.5, 1046);
  ping(t + 4.0, 1174);
  ping(t + 5.8, 1318);

  // ── High shimmer (cinematic highs) ───────────
  [6.2, 6.5, 6.8, 7.1, 7.4].forEach((offset, i) => {
    pad(1760 + i * 110, 0.03, t + offset, 1.5);
  });
}

// ══════════════════════════════════════════════
//  PARTICLES & STARS
// ══════════════════════════════════════════════
const stars = Array.from({ length: 280 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: Math.random() * 1.8 + 0.3,
  a: Math.random(),
  speed: Math.random() * 0.004 + 0.001,
  phase: Math.random() * Math.PI * 2
}));

const dustParticles = Array.from({ length: 60 }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: Math.random() * 1.2 + 0.3,
  vx: (Math.random() - 0.5) * 0.3,
  vy: (Math.random() - 0.5) * 0.15,
  a: Math.random() * 0.4 + 0.1
}));

// ══════════════════════════════════════════════
//  FLIGHT PATHS
// ══════════════════════════════════════════════
const flightPaths = [
  { sx: 200,  sy: 500, cx: 700,  cy: 200, ex: 1200, ey: 380, startT: 1.2, dur: 3.5, color: '#00c8ff' },
  { sx: 350,  sy: 700, cx: 900,  cy: 300, ex: 1600, ey: 450, startT: 1.8, dur: 3.8, color: '#00ffb3' },
  { sx: 100,  sy: 300, cx: 600,  cy: 600, ex: 1400, ey: 280, startT: 2.2, dur: 4.0, color: '#7b8cde' },
  { sx: 500,  sy: 800, cx: 1000, cy: 400, ex: 1750, ey: 600, startT: 2.5, dur: 3.6, color: '#00c8ff' },
  { sx: 50,   sy: 600, cx: 500,  cy: 200, ex: 950,  ey: 500, startT: 3.0, dur: 3.2, color: '#ffd700' },
];

// ══════════════════════════════════════════════
//  RADAR
// ══════════════════════════════════════════════
const radar = { x: W * 0.5, y: H * 0.5, maxR: Math.min(W, H) * 0.42 };

// Blip positions
const blips = [
  { angle: 0.4,  dist: 0.38 },
  { angle: 1.8,  dist: 0.65 },
  { angle: 2.9,  dist: 0.28 },
  { angle: 4.1,  dist: 0.55 },
  { angle: 5.2,  dist: 0.72 },
  { angle: 0.9,  dist: 0.82 },
];

// ══════════════════════════════════════════════
//  PLANE SVG PATH (drawn via canvas)
// ══════════════════════════════════════════════
function drawPlane(cx, cy, angle, scale, alpha) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  ctx.globalAlpha = alpha;
  ctx.beginPath();
  // fuselage
  ctx.moveTo(18, 0);
  ctx.lineTo(-14, -4);
  ctx.lineTo(-14, 4);
  ctx.closePath();
  // left wing
  ctx.moveTo(2, 0);
  ctx.lineTo(-8, -20);
  ctx.lineTo(-14, -4);
  ctx.closePath();
  // right wing
  ctx.moveTo(2, 0);
  ctx.lineTo(-8, 20);
  ctx.lineTo(-14, 4);
  ctx.closePath();
  // tail
  ctx.moveTo(-14, -4);
  ctx.lineTo(-20, -10);
  ctx.lineTo(-18, 0);
  ctx.lineTo(-20, 10);
  ctx.lineTo(-14, 4);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.fill();
  ctx.restore();
}

// ══════════════════════════════════════════════
//  WORLD MAP GRID DOTS (mercator-like)
// ══════════════════════════════════════════════
const LAND_POINTS = (function() {
  // Rough continent outlines as [lon, lat] pairs
  const continents = [
    // North America
    [-130,50],[-125,48],[-120,37],[-118,34],[-95,29],[-90,30],[-80,25],[-75,45],[-72,42],[-68,47],[-63,46],[-80,62],[-96,60],[-120,58],[-138,60],[-152,60],[-165,62],[-160,55],[-155,58],[-140,55],[-130,50],
    // South America
    [-80,0],[-75,-5],[-70,-15],[-65,-20],[-60,-30],[-58,-38],[-65,-45],[-70,-42],[-75,-35],[-72,-25],[-68,-18],[-70,-10],[-75,-5],[-80,0],
    // Europe
    [10,60],[15,58],[20,55],[25,60],[28,65],[25,70],[15,70],[10,63],[5,58],[0,50],[-5,43],[0,38],[10,37],[15,38],[20,40],[25,42],[28,45],[25,48],[20,50],[15,53],[10,55],[8,57],[10,60],
    // Africa
    [15,38],[20,35],[25,32],[32,30],[38,22],[42,12],[45,5],[40,-5],[35,-18],[28,-28],[18,-35],[15,-30],[12,-22],[10,-5],[8,5],[5,10],[0,15],[5,20],[12,25],[15,32],[15,38],
    // Asia
    [28,45],[35,40],[45,38],[55,25],[65,25],[75,22],[85,25],[95,20],[105,10],[115,5],[125,2],[130,5],[140,8],[145,15],[140,22],[135,30],[140,38],[142,45],[138,50],[130,55],[125,60],[120,65],[110,70],[100,75],[85,72],[70,68],[60,65],[55,60],[48,55],[42,50],[35,48],[28,48],[28,45]],
    // Australia
    [[145,-38],[150,-35],[153,-28],[150,-22],[142,-18],[136,-14],[130,-15],[122,-18],[114,-22],[118,-30],[125,-34],[130,-33],[136,-35],[140,-38],[145,-38]],
    // Japan/islands roughly
    [[130,32],[132,34],[134,35],[136,36],[138,38],[140,40],[141,41],[140,42],[139,40],[137,37],[135,35],[133,34],[131,33],[130,32]]
  ];
  const pts = [];
  const offX = W * 0.5, offY = H * 0.52;
  const scX = W / 380, scY = H / 190;
  const flat = Array.isArray(continents[0][0]) ? continents.flat() : continents;
  for (const [lon, lat] of flat) {
    pts.push({ x: offX + lon * scX, y: offY - lat * scY });
  }
  return pts;
})();

// ══════════════════════════════════════════════
//  BEZIER HELPER
// ══════════════════════════════════════════════
function bezier(sx, sy, cx, cy, ex, ey, t) {
  const mt = 1 - t;
  return {
    x: mt*mt*sx + 2*mt*t*cx + t*t*ex,
    y: mt*mt*sy + 2*mt*t*cy + t*t*ey
  };
}
function bezierAngle(sx, sy, cx, cy, ex, ey, t) {
  const dt = 0.01;
  const p1 = bezier(sx, sy, cx, cy, ex, ey, Math.max(0, t - dt));
  const p2 = bezier(sx, sy, cx, cy, ex, ey, Math.min(1, t + dt));
  return Math.atan2(p2.y - p1.y, p2.x - p1.x);
}

// ══════════════════════════════════════════════
//  EASING
// ══════════════════════════════════════════════
function easeOutExpo(t) { return t === 1 ? 1 : 1 - Math.pow(2, -10 * t); }
function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
function clamp01(v) { return Math.max(0, Math.min(1, v)); }
function remap(v, a, b) { return clamp01((v - a) / (b - a)); }

// ══════════════════════════════════════════════
//  MAIN RENDER LOOP
// ══════════════════════════════════════════════
let startTime = null;
let animId = null;

function render(ts) {
  if (!startTime) startTime = ts;
  const elapsed = (ts - startTime) / 1000; // seconds
  const T = elapsed;

  // ── Background gradient ──────────────────────
  const bg = ctx.createRadialGradient(W*0.5, H*0.5, 0, W*0.5, H*0.5, H*0.75);
  bg.addColorStop(0,   '#0a1628');
  bg.addColorStop(0.5, '#060d1a');
  bg.addColorStop(1,   '#020608');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // ── Atmospheric glow ─────────────────────────
  const glowA = remap(T, 0.5, 2.5);
  const glow = ctx.createRadialGradient(W*0.5, H*0.5, 0, W*0.5, H*0.5, H*0.5);
  glow.addColorStop(0,   `rgba(0, 80, 180, ${0.12 * glowA})`);
  glow.addColorStop(0.6, `rgba(0, 40, 100, ${0.07 * glowA})`);
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // ── Stars ────────────────────────────────────
  const starA = remap(T, 0, 1.5);
  stars.forEach(s => {
    s.a = 0.3 + 0.7 * Math.abs(Math.sin(T * s.speed * 10 + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${s.a * starA})`;
    ctx.fill();
  });

  // ── Dust particles ───────────────────────────
  dustParticles.forEach(p => {
    p.x = (p.x + p.vx + W) % W;
    p.y = (p.y + p.vy + H) % H;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,180,255,${p.a * starA * 0.5})`;
    ctx.fill();
  });

  // ── World map dots ────────────────────────────
  const mapA = remap(T, 0.8, 2.5);
  if (mapA > 0) {
    LAND_POINTS.forEach((p, i) => {
      const a = mapA * (0.3 + 0.15 * Math.sin(T * 0.4 + i * 0.1));
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0,160,220,${a})`;
      ctx.fill();
    });
  }

  // ── Latitude / longitude grid lines ──────────
  const gridA = remap(T, 1.0, 3.0) * 0.12;
  if (gridA > 0) {
    ctx.strokeStyle = `rgba(0,140,200,${gridA})`;
    ctx.lineWidth = 0.5;
    // horizontals
    for (let lat = -80; lat <= 80; lat += 20) {
      const offX = W * 0.5, offY = H * 0.52;
      const scX = W / 380, scY = H / 190;
      ctx.beginPath();
      ctx.moveTo(0, offY - lat * scY);
      ctx.lineTo(W, offY - lat * scY);
      ctx.stroke();
    }
    // verticals
    for (let lon = -180; lon <= 180; lon += 30) {
      const offX = W * 0.5, offY = H * 0.52;
      const scX = W / 380;
      ctx.beginPath();
      ctx.moveTo(offX + lon * scX, 0);
      ctx.lineTo(offX + lon * scX, H);
      ctx.stroke();
    }
  }

  // ── Radar sweep ──────────────────────────────
  const radarA = remap(T, 1.5, 3.0);
  if (radarA > 0) {
    const cx = radar.x, cy = radar.y, maxR = radar.maxR;
    const sweepAngle = (T * 1.2) % (Math.PI * 2);

    // Ring circles
    ctx.save();
    ctx.globalAlpha = radarA * 0.25;
    [0.25, 0.5, 0.75, 1.0].forEach(frac => {
      ctx.beginPath();
      ctx.arc(cx, cy, maxR * frac, 0, Math.PI * 2);
      ctx.strokeStyle = '#00c8ff';
      ctx.lineWidth = 0.8;
      ctx.stroke();
    });

    // Crosshairs
    ctx.strokeStyle = 'rgba(0,200,255,0.3)';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(cx - maxR, cy); ctx.lineTo(cx + maxR, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - maxR); ctx.lineTo(cx, cy + maxR); ctx.stroke();
    ctx.restore();

    // Sweep gradient
    ctx.save();
    ctx.globalAlpha = radarA * 0.55;
    ctx.translate(cx, cy);
    ctx.rotate(sweepAngle);
    const sweep = ctx.createConicalGradient
      ? ctx.createConicalGradient(0, 0, 0) // non-standard
      : null;

    // Fallback: draw wedge with gradient
    const grad = ctx.createLinearGradient(0, 0, maxR, 0);
    grad.addColorStop(0,   'rgba(0,220,120,0.0)');
    grad.addColorStop(0.3, 'rgba(0,220,120,0.18)');
    grad.addColorStop(1,   'rgba(0,220,120,0.0)');

    for (let a = 0; a < Math.PI * 0.65; a += 0.015) {
      const fade = 1 - a / (Math.PI * 0.65);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, maxR, -a, -a + 0.018);
      ctx.closePath();
      ctx.fillStyle = `rgba(0,220,130,${0.22 * fade * radarA})`;
      ctx.fill();
    }
    ctx.restore();

    // Blips
    blips.forEach((b, i) => {
      const blipX = cx + Math.cos(b.angle) * maxR * b.dist;
      const blipY = cy + Math.sin(b.angle) * maxR * b.dist;
      const blipAngle = b.angle % (Math.PI * 2);
      const diff = ((sweepAngle - blipAngle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
      const blipA = Math.max(0, 1 - diff / (Math.PI * 0.5)) * radarA;
      if (blipA > 0.01) {
        const glowR = ctx.createRadialGradient(blipX, blipY, 0, blipX, blipY, 14);
        glowR.addColorStop(0,   `rgba(0,255,150,${blipA})`);
        glowR.addColorStop(0.4, `rgba(0,220,120,${blipA * 0.5})`);
        glowR.addColorStop(1,   'rgba(0,0,0,0)');
        ctx.fillStyle = glowR;
        ctx.beginPath();
        ctx.arc(blipX, blipY, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(blipX, blipY, 3, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,255,180,${blipA})`;
        ctx.fill();
      }
    });
  }

  // ── Flight paths ─────────────────────────────
  flightPaths.forEach(fp => {
    const localT = remap(T, fp.startT, fp.startT + fp.dur);
    if (localT <= 0) return;

    // Trail segments
    const steps = 80;
    for (let i = 0; i < steps; i++) {
      const t0 = (i / steps) * localT;
      const t1 = ((i + 1) / steps) * localT;
      if (t0 >= localT) break;
      const p0 = bezier(fp.sx, fp.sy, fp.cx, fp.cy, fp.ex, fp.ey, t0);
      const p1 = bezier(fp.sx, fp.sy, fp.cx, fp.cy, fp.ex, fp.ey, t1);
      const trailFade = (i / steps);
      const alpha = trailFade * 0.7 * easeOutExpo(localT);
      ctx.strokeStyle = fp.color;
      ctx.globalAlpha = alpha;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // Glowing head dot
    const head = bezier(fp.sx, fp.sy, fp.cx, fp.cy, fp.ex, fp.ey, localT);
    const headGlow = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, 18);
    headGlow.addColorStop(0,   fp.color.replace(')', ',0.9)').replace('rgb(', 'rgba(') || `${fp.color}e6`);
    headGlow.addColorStop(0.5, `${fp.color}44`);
    headGlow.addColorStop(1,   'transparent');
    ctx.fillStyle = headGlow;
    ctx.beginPath();
    ctx.arc(head.x, head.y, 18, 0, Math.PI * 2);
    ctx.fill();

    // Plane icon at head
    if (localT < 0.95) {
      const angle = bezierAngle(fp.sx, fp.sy, fp.cx, fp.cy, fp.ex, fp.ey, localT);
      drawPlane(head.x, head.y, angle, 0.9, easeOutExpo(localT));
    }
  });
  ctx.globalAlpha = 1;

  // ── HUD frame corners ─────────────────────────
  const hudA = remap(T, 2.5, 4.0);
  if (hudA > 0) {
    const m = 42, len = 60;
    ctx.strokeStyle = `rgba(0,200,255,${hudA * 0.7})`;
    ctx.lineWidth = 1.8;
    // TL
    ctx.beginPath(); ctx.moveTo(m, m + len); ctx.lineTo(m, m); ctx.lineTo(m + len, m); ctx.stroke();
    // TR
    ctx.beginPath(); ctx.moveTo(W - m - len, m); ctx.lineTo(W - m, m); ctx.lineTo(W - m, m + len); ctx.stroke();
    // BL
    ctx.beginPath(); ctx.moveTo(m, H - m - len); ctx.lineTo(m, H - m); ctx.lineTo(m + len, H - m); ctx.stroke();
    // BR
    ctx.beginPath(); ctx.moveTo(W - m - len, H - m); ctx.lineTo(W - m, H - m); ctx.lineTo(W - m, H - m - len); ctx.stroke();

    // Corner dots
    [[m,m],[W-m,m],[m,H-m],[W-m,H-m]].forEach(([x,y]) => {
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2);
      ctx.fillStyle = `rgba(0,255,200,${hudA})`;
      ctx.fill();
    });
  }

  // ── Scan lines ────────────────────────────────
  if (hudA > 0) {
    for (let y = 0; y < H; y += 4) {
      ctx.fillStyle = `rgba(0,0,0,${0.06 * hudA})`;
      ctx.fillRect(0, y, W, 2);
    }
  }

  // ── HUD telemetry text ────────────────────────
  if (hudA > 0.2) {
    ctx.save();
    ctx.font = '600 13px "Courier New", monospace';
    ctx.fillStyle = `rgba(0,200,255,${hudA * 0.7})`;
    const hudLines = [
      `ALT: ${(8500 + Math.sin(T * 0.3) * 120).toFixed(0)} m`,
      `SPD: ${(890 + Math.sin(T * 0.5) * 15).toFixed(0)} km/h`,
      `HDG: ${(247 + Math.sin(T * 0.2) * 3).toFixed(1)}°`,
    ];
    hudLines.forEach((line, i) => {
      ctx.fillText(line, m + 14, m + 22 + i * 18);
    });
    const rLines = [
      `LAT: 48.8566° N`,
      `LON: 002.3522° E`,
      `SIG: ████▒▒▒`,
    ];
    rLines.forEach((line, i) => {
      const tw = ctx.measureText(line).width;
      ctx.fillText(line, W - m - 14 - tw, m + 22 + i * 18);
    });

    const bLines = [`REISE INSIDER NETWORK`, `AKTIV • ${new Date().toISOString().slice(0,19).replace('T',' ')} UTC`];
    bLines.forEach((line, i) => {
      const tw = ctx.measureText(line).width;
      ctx.fillText(line, W/2 - tw/2, H - m - 8 + i * 18);
    });
    ctx.restore();
  }

  // ── Gold accent bars ─────────────────────────
  const barA = remap(T, 4.8, 5.8);
  if (barA > 0) {
    const barW = easeOutExpo(barA) * 820;
    const barY1 = H * 0.5 - 68;
    const barY2 = H * 0.5 + 62;
    ctx.save();
    // Top bar
    const bg1 = ctx.createLinearGradient(W/2 - barW/2, 0, W/2 + barW/2, 0);
    bg1.addColorStop(0,   'rgba(255,200,0,0)');
    bg1.addColorStop(0.2, 'rgba(255,200,0,0.9)');
    bg1.addColorStop(0.8, 'rgba(255,200,0,0.9)');
    bg1.addColorStop(1,   'rgba(255,200,0,0)');
    ctx.fillStyle = bg1;
    ctx.fillRect(W/2 - barW/2, barY1, barW, 1.5);
    // Bottom bar
    ctx.fillStyle = bg1;
    ctx.fillRect(W/2 - barW/2, barY2, barW, 1.5);
    ctx.restore();
  }

  // ── MAIN TITLE: REISE INSIDER ─────────────────
  const titleA = remap(T, 5.2, 6.4);
  if (titleA > 0) {
    const ta = easeOutExpo(titleA);
    ctx.save();
    ctx.globalAlpha = ta;

    // Glow behind text
    const tglow = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 420);
    tglow.addColorStop(0,   `rgba(0,100,200,${0.35 * ta})`);
    tglow.addColorStop(0.6, `rgba(0,40,80,${0.15 * ta})`);
    tglow.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = tglow;
    ctx.fillRect(0, 0, W, H);

    // "REISE" — upper
    ctx.font = 'bold 108px "Arial Narrow", Arial, sans-serif';
    ctx.letterSpacing = '28px';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // White glow
    ctx.shadowColor = '#00aaff';
    ctx.shadowBlur = 40 * ta;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('REISE', W/2, H/2 - 18);

    // "INSIDER" — lower, gold
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 45 * ta;
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 108px "Arial Narrow", Arial, sans-serif';
    ctx.fillText('INSIDER', W/2, H/2 + 72);

    // Thin separator line between words
    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(255,200,0,${0.6 * ta})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W/2 - 160, H/2 + 24);
    ctx.lineTo(W/2 + 160, H/2 + 24);
    ctx.stroke();

    // Tagline
    ctx.font = '300 22px "Courier New", monospace';
    ctx.letterSpacing = '8px';
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(180,220,255,${ta})`;
    const tagA = remap(T, 6.2, 7.0);
    ctx.globalAlpha = ta * easeOutExpo(tagA);
    ctx.fillText('AVIATION  •  STORIES  •  INSIGHTS', W/2, H/2 + 128);

    ctx.restore();
  }

  // ── Light flare on impact ─────────────────────
  const flareA = remap(T, 5.5, 5.9) * (1 - remap(T, 5.9, 6.5));
  if (flareA > 0) {
    const flare = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, W * 0.6);
    flare.addColorStop(0,   `rgba(255,255,255,${0.22 * flareA})`);
    flare.addColorStop(0.3, `rgba(100,180,255,${0.12 * flareA})`);
    flare.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = flare;
    ctx.fillRect(0, 0, W, H);
  }

  // ── Vignette ──────────────────────────────────
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.3, W/2, H/2, H*0.85);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.72)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);

  // ── Fade in from black ────────────────────────
  const fadeIn = 1 - remap(T, 0, 0.8);
  if (fadeIn > 0) {
    ctx.fillStyle = `rgba(0,0,0,${fadeIn})`;
    ctx.fillRect(0, 0, W, H);
  }

  // ── Fade out at end ───────────────────────────
  const fadeOut = remap(T, 9.5, 10.5);
  if (fadeOut > 0) {
    ctx.fillStyle = `rgba(0,0,0,${fadeOut})`;
    ctx.fillRect(0, 0, W, H);
  }

  if (T < 11) {
    animId = requestAnimationFrame(render);
  }
}

// ══════════════════════════════════════════════
//  START BUTTON
// ══════════════════════════════════════════════
document.getElementById('start-btn').addEventListener('click', function() {
  this.style.display = 'none';
  startAudio();
  startTime = null;
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(render);
});

// Draw first frame immediately (no audio)
requestAnimationFrame(ts => {
  startTime = ts;
  render(ts);
  startTime = null; // reset so next play starts fresh
});
</script>
</body>
</html>
