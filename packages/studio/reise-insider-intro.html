<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Reise Insider — Sting</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;display:flex;align-items:center;justify-content:center;height:100vh;overflow:hidden}
  canvas{display:block}
  #btn{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,200,255,.1);border:1px solid rgba(0,200,255,.5);
    color:#00ccff;font:600 12px 'Courier New',monospace;letter-spacing:5px;
    padding:12px 36px;cursor:pointer;text-transform:uppercase;z-index:9
  }
  #btn:hover{background:rgba(0,200,255,.22);box-shadow:0 0 24px rgba(0,200,255,.4)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="btn">&#9654; PLAY</button>
<script>
/* ================================================
   REISE INSIDER — Mid-Video Sting  (3 seconds)
   Clean, punchy, works overlaid on any footage.
   ================================================ */

var W=1920, H=1080;
var cv=document.getElementById('c');
var g=cv.getContext('2d');
cv.width=W; cv.height=H;

// scale to viewport
function fit(){
  var s=Math.min(innerWidth/W,innerHeight/H);
  cv.style.width=W*s+'px'; cv.style.height=H*s+'px';
}
fit(); window.addEventListener('resize',fit);

// ── helpers ──────────────────────────────────
function cl(v){return v<0?0:v>1?1:v;}
function rmp(v,a,b){return cl((v-a)/(b-a));}
function eoe(t){return t>=1?1:1-Math.pow(2,-10*t);}   // out expo
function eoi(t){return t<=0?0:Math.pow(2,10*t-10);}   // in expo
function eos(t){                                        // out elastic (slam)
  var c=2*Math.PI/3;
  return t<=0?0:t>=1?1:Math.pow(2,-9*t)*Math.sin((t*10-.75)*c)+1;
}

// ── audio ────────────────────────────────────
function audio(){
  var A=window.AudioContext||window.webkitAudioContext;
  if(!A) return;
  var ac=new A(), t=ac.currentTime;
  var out=ac.createGain();
  out.gain.setValueAtTime(1,t);
  out.gain.setValueAtTime(1,t+4.0);
  out.gain.linearRampToValueAtTime(0,t+4.8);
  out.connect(ac.destination);

  // sub-bass boom
  function boom(freq,vol,st,dur){
    var o=ac.createOscillator(),f=ac.createBiquadFilter(),gn=ac.createGain();
    f.type='lowpass';f.frequency.value=260;
    o.type='sine';o.frequency.setValueAtTime(freq,st);
    o.frequency.exponentialRampToValueAtTime(freq*.5,st+dur);
    gn.gain.setValueAtTime(0,st);
    gn.gain.linearRampToValueAtTime(vol,st+.015);
    gn.gain.exponentialRampToValueAtTime(.001,st+dur);
    o.connect(f);f.connect(gn);gn.connect(out);
    o.start(st);o.stop(st+dur+.1);
  }
  boom(80,1.2, t+.02, .55);     // opening punch
  boom(55,.8,  t+.04, .7);
  boom(60,1.5, t+1.0, .5);      // title slam

  // noise crack
  function crack(st,dur,vol,cut){
    var buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate);
    var d=buf.getChannelData(0);
    for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(ac.sampleRate*dur*.3));
    var src=ac.createBufferSource(),gn=ac.createGain(),f=ac.createBiquadFilter();
    f.type='lowpass';f.frequency.value=cut||300;
    gn.gain.setValueAtTime(vol,st);
    gn.gain.exponentialRampToValueAtTime(.001,st+dur);
    src.buffer=buf;src.connect(f);f.connect(gn);gn.connect(out);src.start(st);
  }
  crack(t+.02,.4,1.8,200);      // opening
  crack(t+1.0,.35,2.0,180);     // title

  // metallic ring
  function ring(st,freq,vol,dur){
    var o=ac.createOscillator(),gn=ac.createGain();
    o.type='sine';o.frequency.value=freq;
    gn.gain.setValueAtTime(vol,st);
    gn.gain.exponentialRampToValueAtTime(.001,st+dur);
    o.connect(gn);gn.connect(out);o.start(st);o.stop(st+dur+.05);
  }
  ring(t+.05, 880, .22, .8);
  ring(t+.08,1320, .14, .7);
  ring(t+1.0,1760, .28, 1.0);
  ring(t+1.05,2200,.14, .9);

  // rising whoosh into slam
  var sw=ac.createOscillator(),swg=ac.createGain(),swf=ac.createBiquadFilter();
  swf.type='bandpass';swf.Q.value=6;
  sw.type='sawtooth';
  sw.frequency.setValueAtTime(200,t+.4);
  sw.frequency.exponentialRampToValueAtTime(1600,t+.98);
  swf.frequency.setValueAtTime(200,t+.4);
  swf.frequency.exponentialRampToValueAtTime(1600,t+.98);
  swg.gain.setValueAtTime(0,t+.4);
  swg.gain.linearRampToValueAtTime(.2,t+.85);
  swg.gain.linearRampToValueAtTime(0,t+1.02);
  sw.connect(swf);swf.connect(swg);swg.connect(out);
  sw.start(t+.4);sw.stop(t+1.1);

  // sparkle tail
  [1.3,1.5,1.7,1.95,2.2].forEach(function(off,i){
    ring(t+off, 2000+i*400, .06, .5);
  });
}

// ── particle pool ────────────────────────────
var parts=[];
function burst(px,py,n,spd,col){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2;
    var s=(Math.random()*.7+.3)*spd;
    parts.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:1,dec:Math.random()*.022+.014,r:Math.random()*3.5+.8,col:col});
  }
}

// ── shockwave rings ───────────────────────────
var waves=[];
function wave(px,py,col,max){
  waves.push({x:px,y:py,r:0,max:max||700,col:col,a:1});
}

// ── draw plane icon ──────────────────────────
function plane(px,py,angle,sc,alpha){
  g.save();
  g.translate(px,py); g.rotate(angle); g.scale(sc,sc);
  g.globalAlpha=alpha; g.fillStyle='#fff';
  // body
  g.beginPath();g.moveTo(22,0);g.lineTo(-16,-5);g.lineTo(-16,5);g.closePath();g.fill();
  // wings
  g.beginPath();g.moveTo(4,0);g.lineTo(-10,-24);g.lineTo(-16,-5);g.closePath();g.fill();
  g.beginPath();g.moveTo(4,0);g.lineTo(-10,24);g.lineTo(-16,5);g.closePath();g.fill();
  // tail
  g.beginPath();g.moveTo(-16,-5);g.lineTo(-23,-13);g.lineTo(-20,0);g.lineTo(-23,13);g.lineTo(-16,5);g.closePath();g.fill();
  g.restore();
}

// ── state ────────────────────────────────────
var T0=null, raf=null;
var did={open:false,slam:false};

function draw(ts){
  if(!T0) T0=ts;
  var T=(ts-T0)/1000;

  // one-shot events
  if(T>.02 && !did.open){
    burst(W/2,H/2,140,20,'#00ccff');
    burst(W/2,H/2,80,14,'#ffffff');
    wave(W/2,H/2,'#00ccff',800);
    wave(W/2,H/2,'#00aaff',520);
    did.open=true;
  }
  if(T>1.0 && !did.slam){
    burst(W/2,H/2,200,24,'#ffd700');
    burst(W/2,H/2,120,16,'#ff9900');
    burst(W/2,H/2,80,10,'#ffffff');
    wave(W/2,H/2,'#ffd700',900);
    wave(W/2,H/2,'#ff9900',680);
    wave(W/2,H/2,'#ffffff',460);
    did.slam=true;
  }

  // ── background ──────────────────────────
  // Deep space — not pure black so particles read
  var bg=g.createRadialGradient(W/2,H/2,0,W/2,H/2,H*.7);
  bg.addColorStop(0,'#0a101e');
  bg.addColorStop(1,'#020408');
  g.fillStyle=bg; g.fillRect(0,0,W,H);

  // ── opening flash ────────────────────────
  var fl=rmp(T,0,.12)*(1-rmp(T,.12,.45));
  if(fl>0){g.fillStyle='rgba(255,255,255,'+fl*.95+')';g.fillRect(0,0,W,H);}

  // ── shockwaves ───────────────────────────
  for(var i=0;i<waves.length;i++){
    var w=waves[i];
    w.r+=(w.max-w.r)*.1;
    w.a-=.028;
    if(w.a<0) continue;
    g.beginPath();g.arc(w.x,w.y,w.r,0,Math.PI*2);
    g.strokeStyle=w.col;g.globalAlpha=w.a*.8;
    g.lineWidth=Math.max(1,3*w.a);g.stroke();
    g.globalAlpha=1;
  }
  waves=waves.filter(function(w){return w.a>0;});

  // ── animated ring / logo mark ─────────────
  var ringT=rmp(T,.08,.55);
  if(ringT>0){
    var re=eoe(ringT);
    var cx2=W/2, cy2=H/2;
    var R=120*re;
    // outer ring
    g.save();
    g.beginPath();g.arc(cx2,cy2,R,0,Math.PI*2);
    g.strokeStyle='#00ddff';g.globalAlpha=re*.7;g.lineWidth=2;g.stroke();
    // tick marks
    for(var a=0;a<360;a+=30){
      var rad=a*Math.PI/180;
      var x1=cx2+Math.cos(rad)*(R-8),y1=cy2+Math.sin(rad)*(R-8);
      var x2=cx2+Math.cos(rad)*(R+2),y2=cy2+Math.sin(rad)*(R+2);
      g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);
      g.strokeStyle='#00ffff';g.lineWidth=1;g.stroke();
    }
    // plane in center
    plane(cx2, cy2, -Math.PI/8, 2.4, re*.9);
    // spinning dashes
    g.translate(cx2,cy2);g.rotate(T*2.5);
    g.setLineDash([12,28]);
    g.beginPath();g.arc(0,0,R+18,0,Math.PI*2);
    g.strokeStyle='rgba(0,200,255,'+re*.4+')';g.lineWidth=1;g.stroke();
    g.setLineDash([]);
    g.restore();
  }

  // ── particles ────────────────────────────
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.life-=p.dec;
    if(p.life<=0) continue;
    g.beginPath();g.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);
    g.fillStyle=p.col;g.globalAlpha=p.life*.85;
    g.shadowColor=p.col;g.shadowBlur=p.r*5;
    g.fill();g.shadowBlur=0;g.globalAlpha=1;
  }
  parts=parts.filter(function(p){return p.life>0;});

  // ── TITLE SLAM ───────────────────────────
  var titleT=rmp(T,1.0,1.55);
  if(titleT>0){
    var te=eos(titleT);   // elastic overshoot

    // glow plate behind text
    var gr=g.createRadialGradient(W/2,H/2,0,W/2,H/2,480);
    gr.addColorStop(0,'rgba(255,160,0,'+(te*.3)+')');
    gr.addColorStop(.55,'rgba(180,80,0,'+(te*.12)+')');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(0,0,W,H);

    g.save();
    g.textAlign='center';g.textBaseline='middle';

    // chromatic aberration offset (fades out as slam settles)
    var ca=(1-cl(titleT/.6))*16;

    // REISE
    g.font='900 130px "Arial Black",Arial,sans-serif';
    if(ca>1){
      g.globalAlpha=te*.3;
      g.fillStyle='#ff0033';g.fillText('REISE',W/2+ca,H/2-30);
      g.fillStyle='#0033ff';g.fillText('REISE',W/2-ca,H/2-30);
    }
    g.globalAlpha=te;
    g.shadowColor='#00ccff';g.shadowBlur=55*te;
    g.fillStyle='#ffffff';g.fillText('REISE',W/2,H/2-30);

    // INSIDER
    g.font='900 130px "Arial Black",Arial,sans-serif';
    if(ca>1){
      g.globalAlpha=te*.3;
      g.fillStyle='#ff0033';g.fillText('INSIDER',W/2+ca,H/2+88);
      g.fillStyle='#0033ff';g.fillText('INSIDER',W/2-ca,H/2+88);
    }
    g.globalAlpha=te;
    g.shadowColor='#ffaa00';g.shadowBlur=65*te;
    g.fillStyle='#ffd700';g.fillText('INSIDER',W/2,H/2+88);

    // large plane silhouette spanning the channel name
    g.shadowBlur=0;
    g.globalAlpha=te*.13;
    g.shadowColor='#00ccff'; g.shadowBlur=40;
    plane(W/2, H/2+29, -Math.PI/14, 18, 1);
    g.shadowBlur=0;
    g.globalAlpha=te*.07;
    plane(W/2+18, H/2+29, -Math.PI/14, 18, 1);  // second pass wider glow

    // divider line — draws outward from center
    g.shadowBlur=0;
    var lw=eoe(titleT)*360;
    g.globalAlpha=te*.65;
    g.strokeStyle='#ffd700';g.lineWidth=1.5;
    g.beginPath();g.moveTo(W/2-lw,H/2+32);g.lineTo(W/2+lw,H/2+32);g.stroke();

    // tagline
    var tagt=rmp(T,1.6,2.2);
    if(tagt>0){
      g.globalAlpha=eoe(tagt)*te;
      g.font='300 20px "Courier New",monospace';
      g.fillStyle='rgba(180,220,255,1)';
      g.shadowBlur=0;
      g.fillText('AVIATION  •  STORIES  •  INSIGHTS',W/2,H/2+160);
    }
    g.restore();
  }

  // ── slam flash ───────────────────────────
  var sf=rmp(T,.98,1.08)*(1-rmp(T,1.08,1.35));
  if(sf>0){g.fillStyle='rgba(255,255,255,'+sf*.8+')';g.fillRect(0,0,W,H);}

  // ── film grain ───────────────────────────
  g.save();g.globalAlpha=.04;
  for(var i=0;i<900;i++){
    var v=Math.random()*255|0;
    g.fillStyle='rgb('+v+','+v+','+v+')';
    g.fillRect(Math.random()*W|0,Math.random()*H|0,Math.random()*2+1,Math.random()*2+1);
  }
  g.restore();

  // ── vignette ─────────────────────────────
  var vg=g.createRadialGradient(W/2,H/2,H*.18,W/2,H/2,H*.82);
  vg.addColorStop(0,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.8)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);

  // ── fade in ──────────────────────────────
  var fi=1-rmp(T,0,.06);
  if(fi>0){g.fillStyle='rgba(0,0,0,'+fi+')';g.fillRect(0,0,W,H);}

  // ── fade out ─────────────────────────────
  var fo=rmp(T,4.2,4.8);
  if(fo>0){g.fillStyle='rgba(0,0,0,'+fo+')';g.fillRect(0,0,W,H);}

  if(T<5.2) raf=requestAnimationFrame(draw);
}

// preview
g.fillStyle='#060b14';g.fillRect(0,0,W,H);

document.getElementById('btn').addEventListener('click',function(){
  this.style.display='none';
  parts=[];waves=[];did={open:false,slam:false};
  audio();
  T0=null;
  if(raf) cancelAnimationFrame(raf);
  raf=requestAnimationFrame(draw);
});
</script>
</body>
</html>
