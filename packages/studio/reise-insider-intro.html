<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reise Insider — Aviation Intro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    canvas { display: block; max-width: 100vw; max-height: 100vh; }
    #btn {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,180,255,0.12);
      border: 1px solid rgba(0,180,255,0.55);
      color: #00c8ff; font-family: 'Courier New', monospace;
      font-size: 13px; letter-spacing: 5px; padding: 14px 38px;
      cursor: pointer; text-transform: uppercase; z-index: 100;
      transition: background 0.3s, box-shadow 0.3s;
    }
    #btn:hover { background: rgba(0,180,255,0.28); box-shadow: 0 0 28px rgba(0,180,255,0.4); }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<button id="btn">&#9654; PLAY INTRO</button>

<script>
// ─────────────────────────────────────────────
//  REISE INSIDER  —  Premium Aviation Intro
//  1920 × 1080  •  ~10 s  •  Canvas + WebAudio
// ─────────────────────────────────────────────

const W = 1920, H = 1080;
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
canvas.width = W; canvas.height = H;

// keep aspect ratio on resize
(function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width  = W * s + 'px';
  canvas.style.height = H * s + 'px';
})();
window.addEventListener('resize', function() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.style.width  = W * s + 'px';
  canvas.style.height = H * s + 'px';
});

// ══════════════════════════════════════════════
//  EASING UTILITIES
// ══════════════════════════════════════════════
function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
function remap(v, a, b) { return clamp01((v - a) / (b - a)); }
function easeOutExpo(t) { return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t); }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

// ══════════════════════════════════════════════
//  WEB AUDIO — cinematic score
// ══════════════════════════════════════════════
function startAudio() {
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  var ac = new AC();
  var t  = ac.currentTime;

  var master = ac.createGain();
  master.gain.setValueAtTime(0, t);
  master.gain.linearRampToValueAtTime(0.85, t + 1.8);
  master.gain.setValueAtTime(0.85, t + 8.5);
  master.gain.linearRampToValueAtTime(0, t + 10.5);
  master.connect(ac.destination);

  // --- pad tone ---
  function pad(freq, vol, st, dur) {
    var o = ac.createOscillator();
    var g = ac.createGain();
    var f = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 900;
    o.type = 'sawtooth'; o.frequency.value = freq;
    g.gain.setValueAtTime(0, st);
    g.gain.linearRampToValueAtTime(vol, st + 1.4);
    g.gain.setValueAtTime(vol, st + dur - 1.2);
    g.gain.linearRampToValueAtTime(0, st + dur);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(st); o.stop(st + dur);
  }

  // Dm pad — root + harmonics
  [36.7, 73.4, 110, 146.8, 220, 261.6, 293.7].forEach(function(f, i) {
    pad(f, [0.2, 0.15, 0.12, 0.1, 0.08, 0.06, 0.05][i], t, 11);
  });

  // rising sweep
  var sw  = ac.createOscillator();
  var swg = ac.createGain();
  var swf = ac.createBiquadFilter();
  swf.type = 'bandpass'; swf.Q.value = 10;
  sw.type = 'sawtooth';
  sw.frequency.setValueAtTime(90, t + 3.5);
  sw.frequency.exponentialRampToValueAtTime(1400, t + 6.2);
  swf.frequency.setValueAtTime(90, t + 3.5);
  swf.frequency.exponentialRampToValueAtTime(1400, t + 6.2);
  swg.gain.setValueAtTime(0, t + 3.5);
  swg.gain.linearRampToValueAtTime(0.14, t + 5.0);
  swg.gain.linearRampToValueAtTime(0, t + 7.0);
  sw.connect(swf); swf.connect(swg); swg.connect(master);
  sw.start(t + 3.5); sw.stop(t + 7.2);

  // impact bass hit
  function impact(st) {
    var buf  = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    var data = buf.getChannelData(0);
    for (var i = 0; i < data.length; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ac.sampleRate * 0.06));
    }
    var src = ac.createBufferSource();
    var g   = ac.createGain();
    var f   = ac.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 180;
    g.gain.setValueAtTime(1.6, st);
    g.gain.exponentialRampToValueAtTime(0.001, st + 0.5);
    src.buffer = buf;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(st);
  }
  impact(t + 5.6);

  // radar pings
  function ping(st, freq) {
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.2, st);
    g.gain.exponentialRampToValueAtTime(0.001, st + 0.7);
    o.connect(g); g.connect(master);
    o.start(st); o.stop(st + 0.8);
  }
  ping(t + 1.0, 880);
  ping(t + 2.4, 1046);
  ping(t + 3.9, 1174);
  ping(t + 5.6, 1318);

  // high shimmer tail
  [6.0, 6.3, 6.6, 6.9, 7.2].forEach(function(off, i) {
    pad(1760 + i * 110, 0.03, t + off, 1.6);
  });
}

// ══════════════════════════════════════════════
//  WORLD MAP — flat [lon, lat] pairs
// ══════════════════════════════════════════════
var MAP_PAIRS = [
  // North America
  -130,50, -125,48, -120,37, -118,34, -95,29, -90,30, -80,25,
  -75,45, -72,42, -68,47, -63,46, -80,62, -96,60, -120,58,
  -138,60, -152,60, -165,62, -160,55, -140,55, -130,50,
  // South America
  -80,0, -75,-5, -70,-15, -65,-20, -60,-30, -58,-38,
  -65,-45, -70,-42, -75,-35, -72,-25, -68,-18, -70,-10, -75,-5, -80,0,
  // Europe
  10,60, 15,58, 20,55, 25,60, 28,65, 25,70, 15,70, 10,63,
  5,58, 0,50, -5,43, 0,38, 10,37, 15,38, 20,40, 25,42,
  28,45, 25,48, 20,50, 15,53, 10,55, 8,57, 10,60,
  // Africa
  15,38, 20,35, 25,32, 32,30, 38,22, 42,12, 45,5, 40,-5,
  35,-18, 28,-28, 18,-35, 15,-30, 12,-22, 10,-5, 8,5,
  5,10, 0,15, 5,20, 12,25, 15,32, 15,38,
  // Asia
  28,45, 35,40, 45,38, 55,25, 65,25, 75,22, 85,25, 95,20,
  105,10, 115,5, 125,2, 130,5, 140,8, 145,15, 140,22,
  135,30, 140,38, 142,45, 138,50, 130,55, 125,60, 120,65,
  110,70, 100,75, 85,72, 70,68, 60,65, 55,60, 48,55,
  42,50, 35,48, 28,48, 28,45,
  // Australia
  145,-38, 150,-35, 153,-28, 150,-22, 142,-18, 136,-14,
  130,-15, 122,-18, 114,-22, 118,-30, 125,-34, 130,-33,
  136,-35, 140,-38, 145,-38
];

var MAP_DOTS = (function() {
  var pts  = [];
  var offX = W * 0.5, offY = H * 0.52;
  var scX  = W / 380,  scY  = H / 190;
  for (var i = 0; i < MAP_PAIRS.length; i += 2) {
    pts.push({
      x: offX + MAP_PAIRS[i]     * scX,
      y: offY - MAP_PAIRS[i + 1] * scY
    });
  }
  return pts;
})();

// ══════════════════════════════════════════════
//  STARS & PARTICLES
// ══════════════════════════════════════════════
var STARS = [];
for (var i = 0; i < 300; i++) {
  STARS.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.8 + 0.3,
    phase: Math.random() * Math.PI * 2,
    speed: Math.random() * 0.8 + 0.3
  });
}

var DUST = [];
for (var i = 0; i < 55; i++) {
  DUST.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.1 + 0.3,
    vx: (Math.random() - 0.5) * 0.25,
    vy: (Math.random() - 0.5) * 0.12,
    a: Math.random() * 0.35 + 0.08
  });
}

// ══════════════════════════════════════════════
//  FLIGHT PATHS  (Bézier sx,sy → cx,cy → ex,ey)
// ══════════════════════════════════════════════
var PATHS = [
  { sx:180, sy:520, cx:700,  cy:180, ex:1260, ey:380, st:1.2, dur:3.6, col:'#00c8ff' },
  { sx:320, sy:720, cx:880,  cy:280, ex:1660, ey:440, st:1.9, dur:3.9, col:'#00ffb3' },
  { sx: 80, sy:320, cx:580,  cy:640, ex:1440, ey:260, st:2.3, dur:4.1, col:'#8888ff' },
  { sx:520, sy:820, cx:1020, cy:420, ex:1780, ey:580, st:2.6, dur:3.7, col:'#00c8ff' },
  { sx: 40, sy:580, cx:480,  cy:200, ex:980,  ey:520, st:3.1, dur:3.3, col:'#ffd700' },
];

// ══════════════════════════════════════════════
//  RADAR BLIPS
// ══════════════════════════════════════════════
var BLIPS = [
  { angle:0.40, dist:0.38 },
  { angle:1.80, dist:0.65 },
  { angle:2.90, dist:0.28 },
  { angle:4.10, dist:0.55 },
  { angle:5.20, dist:0.72 },
  { angle:0.90, dist:0.82 },
];

// ══════════════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════════════
function bezPt(sx,sy,cx,cy,ex,ey,t) {
  var m = 1 - t;
  return { x: m*m*sx + 2*m*t*cx + t*t*ex,
           y: m*m*sy + 2*m*t*cy + t*t*ey };
}
function bezAngle(sx,sy,cx,cy,ex,ey,t) {
  var a = bezPt(sx,sy,cx,cy,ex,ey, Math.max(0, t-0.01));
  var b = bezPt(sx,sy,cx,cy,ex,ey, Math.min(1, t+0.01));
  return Math.atan2(b.y - a.y, b.x - a.x);
}

function drawPlane(px, py, angle, sc, alpha) {
  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(angle);
  ctx.scale(sc, sc);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(18, 0); ctx.lineTo(-14,-4); ctx.lineTo(-14, 4); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(2,0); ctx.lineTo(-8,-20); ctx.lineTo(-14,-4); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(2,0); ctx.lineTo(-8, 20); ctx.lineTo(-14, 4); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-14,-4); ctx.lineTo(-20,-10); ctx.lineTo(-18,0);
  ctx.lineTo(-20,10); ctx.lineTo(-14,4); ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
var startTime = null;
var rafId     = null;

function render(ts) {
  if (!startTime) startTime = ts;
  var T = (ts - startTime) / 1000;
  var HUD_M = 42; // HUD margin — used throughout this function

  // ── background ───────────────────────────────
  var bg = ctx.createRadialGradient(W*.5,H*.5,0, W*.5,H*.5, H*.8);
  bg.addColorStop(0,   '#0b1628');
  bg.addColorStop(0.5, '#060d1a');
  bg.addColorStop(1,   '#020508');
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  // ── atmospheric glow ──────────────────────────
  var ga = remap(T, 0.4, 2.5);
  if (ga > 0) {
    var gg = ctx.createRadialGradient(W*.5,H*.5,0, W*.5,H*.5, H*.52);
    gg.addColorStop(0, 'rgba(0,80,200,'+(0.14*ga)+')');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = gg; ctx.fillRect(0,0,W,H);
  }

  // ── stars ────────────────────────────────────
  var sa = remap(T, 0, 1.4);
  for (var i = 0; i < STARS.length; i++) {
    var s = STARS[i];
    var a = (0.3 + 0.7 * Math.abs(Math.sin(T * s.speed + s.phase))) * sa;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,' + a + ')';
    ctx.fill();
  }

  // ── dust ─────────────────────────────────────
  for (var i = 0; i < DUST.length; i++) {
    var d = DUST[i];
    d.x = (d.x + d.vx + W) % W;
    d.y = (d.y + d.vy + H) % H;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(0,180,255,' + (d.a * sa * 0.45) + ')';
    ctx.fill();
  }

  // ── world map dots ────────────────────────────
  var ma = remap(T, 0.8, 2.6);
  if (ma > 0) {
    for (var i = 0; i < MAP_DOTS.length; i++) {
      var p = MAP_DOTS[i];
      var a = ma * (0.28 + 0.14 * Math.sin(T * 0.35 + i * 0.12));
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.6, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,160,225,' + a + ')';
      ctx.fill();
    }
  }

  // ── lat/lon grid ──────────────────────────────
  var gra = remap(T, 1.0, 3.0) * 0.11;
  if (gra > 0) {
    var offX = W*.5, offY = H*.52, scX = W/380, scY = H/190;
    ctx.strokeStyle = 'rgba(0,140,210,' + gra + ')';
    ctx.lineWidth = 0.5;
    for (var lat = -80; lat <= 80; lat += 20) {
      ctx.beginPath(); ctx.moveTo(0, offY - lat*scY); ctx.lineTo(W, offY - lat*scY); ctx.stroke();
    }
    for (var lon = -180; lon <= 180; lon += 30) {
      ctx.beginPath(); ctx.moveTo(offX + lon*scX, 0); ctx.lineTo(offX + lon*scX, H); ctx.stroke();
    }
  }

  // ── radar sweep ───────────────────────────────
  var ra = remap(T, 1.5, 3.0);
  if (ra > 0) {
    var rcx = W*.5, rcy = H*.5, rmax = Math.min(W,H)*.42;
    var sweepA = (T * 1.2) % (Math.PI * 2);

    // rings
    ctx.save(); ctx.globalAlpha = ra * 0.22;
    ctx.strokeStyle = '#00c8ff'; ctx.lineWidth = 0.8;
    [.25,.5,.75,1].forEach(function(f) {
      ctx.beginPath(); ctx.arc(rcx, rcy, rmax*f, 0, Math.PI*2); ctx.stroke();
    });
    ctx.strokeStyle = 'rgba(0,200,255,0.28)';
    ctx.lineWidth = 0.5;
    ctx.beginPath(); ctx.moveTo(rcx-rmax,rcy); ctx.lineTo(rcx+rmax,rcy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rcx,rcy-rmax); ctx.lineTo(rcx,rcy+rmax); ctx.stroke();
    ctx.restore();

    // sweep wedge
    ctx.save();
    ctx.globalAlpha = ra * 0.5;
    ctx.translate(rcx, rcy);
    ctx.rotate(sweepA);
    for (var a = 0; a < Math.PI * 0.65; a += 0.016) {
      var fade = 1 - a / (Math.PI * 0.65);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.arc(0, 0, rmax, -a, -a + 0.018);
      ctx.closePath();
      ctx.fillStyle = 'rgba(0,220,130,' + (0.22 * fade) + ')';
      ctx.fill();
    }
    ctx.restore();

    // blips
    ctx.save();
    for (var i = 0; i < BLIPS.length; i++) {
      var b = BLIPS[i];
      var bx = rcx + Math.cos(b.angle) * rmax * b.dist;
      var by = rcy + Math.sin(b.angle) * rmax * b.dist;
      var diff = ((sweepA - b.angle) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
      var ba = Math.max(0, 1 - diff / (Math.PI * 0.5)) * ra;
      if (ba > 0.01) {
        var gr = ctx.createRadialGradient(bx,by,0, bx,by, 14);
        gr.addColorStop(0, 'rgba(0,255,160,' + ba + ')');
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(bx,by,14,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(bx,by,3,0,Math.PI*2);
        ctx.fillStyle = 'rgba(0,255,180,' + ba + ')'; ctx.fill();
      }
    }
    ctx.restore();
  }

  // ── flight paths ─────────────────────────────
  for (var i = 0; i < PATHS.length; i++) {
    var fp = PATHS[i];
    var lt = remap(T, fp.st, fp.st + fp.dur);
    if (lt <= 0) continue;
    var steps = 80;
    for (var j = 0; j < steps; j++) {
      var t0 = (j / steps) * lt;
      var t1 = ((j+1) / steps) * lt;
      if (t0 >= lt) break;
      var p0 = bezPt(fp.sx,fp.sy,fp.cx,fp.cy,fp.ex,fp.ey, t0);
      var p1 = bezPt(fp.sx,fp.sy,fp.cx,fp.cy,fp.ex,fp.ey, t1);
      ctx.globalAlpha = (j / steps) * 0.75 * easeOutExpo(lt);
      ctx.strokeStyle = fp.col;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // glow head
    var h = bezPt(fp.sx,fp.sy,fp.cx,fp.cy,fp.ex,fp.ey, lt);
    var hg = ctx.createRadialGradient(h.x,h.y,0, h.x,h.y, 20);
    hg.addColorStop(0, fp.col); hg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(h.x,h.y,20,0,Math.PI*2); ctx.fill();

    // plane icon
    if (lt < 0.96) {
      var ang = bezAngle(fp.sx,fp.sy,fp.cx,fp.cy,fp.ex,fp.ey, lt);
      drawPlane(h.x, h.y, ang, 0.9, easeOutExpo(lt));
    }
  }
  ctx.globalAlpha = 1;

  // ── HUD frame & data ─────────────────────────
  var ha = remap(T, 2.5, 4.0);
  if (ha > 0) {
    var len = 60;
    ctx.strokeStyle = 'rgba(0,200,255,' + (ha * 0.68) + ')';
    ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(HUD_M, HUD_M+len); ctx.lineTo(HUD_M, HUD_M); ctx.lineTo(HUD_M+len, HUD_M); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-HUD_M-len, HUD_M); ctx.lineTo(W-HUD_M, HUD_M); ctx.lineTo(W-HUD_M, HUD_M+len); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(HUD_M, H-HUD_M-len); ctx.lineTo(HUD_M, H-HUD_M); ctx.lineTo(HUD_M+len, H-HUD_M); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W-HUD_M-len, H-HUD_M); ctx.lineTo(W-HUD_M, H-HUD_M); ctx.lineTo(W-HUD_M, H-HUD_M-len); ctx.stroke();

    [[HUD_M,HUD_M],[W-HUD_M,HUD_M],[HUD_M,H-HUD_M],[W-HUD_M,H-HUD_M]].forEach(function(pt) {
      ctx.beginPath(); ctx.arc(pt[0],pt[1],3,0,Math.PI*2);
      ctx.fillStyle = 'rgba(0,255,200,' + ha + ')'; ctx.fill();
    });

    // scanlines
    for (var y = 0; y < H; y += 4) {
      ctx.fillStyle = 'rgba(0,0,0,' + (0.055 * ha) + ')';
      ctx.fillRect(0, y, W, 2);
    }

    // telemetry text
    ctx.save();
    ctx.font = '600 13px "Courier New",monospace';
    ctx.fillStyle = 'rgba(0,200,255,' + (ha * 0.72) + ')';
    var leftLines = [
      'ALT: ' + (8500 + Math.sin(T*0.3)*120).toFixed(0) + ' m',
      'SPD: ' + (890  + Math.sin(T*0.5)* 15).toFixed(0) + ' km/h',
      'HDG: ' + (247  + Math.sin(T*0.2)*  3).toFixed(1) + '\xb0',
    ];
    for (var j = 0; j < leftLines.length; j++) {
      ctx.fillText(leftLines[j], HUD_M + 14, HUD_M + 22 + j * 18);
    }
    var rightLines = ['LAT: 48.8566\xb0 N', 'LON: 002.3522\xb0 E', 'SIG: ████▒▒▒'];
    for (var j = 0; j < rightLines.length; j++) {
      var tw = ctx.measureText(rightLines[j]).width;
      ctx.fillText(rightLines[j], W - HUD_M - 14 - tw, HUD_M + 22 + j * 18);
    }
    var bottomLines = ['REISE INSIDER NETWORK', 'AKTIV • LIVE TRACKING'];
    for (var j = 0; j < bottomLines.length; j++) {
      var tw = ctx.measureText(bottomLines[j]).width;
      ctx.fillText(bottomLines[j], W/2 - tw/2, H - HUD_M - 10 + j * 18);
    }
    ctx.restore();
  }

  // ── gold accent bars ─────────────────────────
  var ba2 = remap(T, 4.8, 5.8);
  if (ba2 > 0) {
    var bw = easeOutExpo(ba2) * 840;
    var barGrad = ctx.createLinearGradient(W/2-bw/2,0, W/2+bw/2,0);
    barGrad.addColorStop(0,   'rgba(255,200,0,0)');
    barGrad.addColorStop(0.2, 'rgba(255,200,0,0.9)');
    barGrad.addColorStop(0.8, 'rgba(255,200,0,0.9)');
    barGrad.addColorStop(1,   'rgba(255,200,0,0)');
    ctx.fillStyle = barGrad;
    ctx.fillRect(W/2-bw/2, H*.5-68, bw, 1.5);
    ctx.fillRect(W/2-bw/2, H*.5+62, bw, 1.5);
  }

  // ── main title ───────────────────────────────
  var ta = remap(T, 5.2, 6.4);
  if (ta > 0) {
    var tea = easeOutExpo(ta);

    // behind-text glow
    var tg = ctx.createRadialGradient(W/2,H/2,0, W/2,H/2, 440);
    tg.addColorStop(0,   'rgba(0,100,200,' + (0.38*tea) + ')');
    tg.addColorStop(0.6, 'rgba(0,40,80,'  + (0.15*tea) + ')');
    tg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = tg; ctx.fillRect(0,0,W,H);

    ctx.save();
    ctx.globalAlpha = tea;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // REISE — white + blue glow
    ctx.font = 'bold 108px "Arial Narrow",Arial,sans-serif';
    ctx.shadowColor = '#00aaff'; ctx.shadowBlur = 48 * tea;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('REISE', W/2, H/2 - 20);

    // INSIDER — gold
    ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 52 * tea;
    ctx.fillStyle = '#ffd700';
    ctx.fillText('INSIDER', W/2, H/2 + 72);

    // thin divider
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,200,0,' + (0.55*tea) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2-170, H/2+25); ctx.lineTo(W/2+170, H/2+25); ctx.stroke();

    // tagline
    var taga = remap(T, 6.2, 7.2);
    if (taga > 0) {
      ctx.globalAlpha = tea * easeOutCubic(taga);
      ctx.font = '300 22px "Courier New",monospace';
      ctx.fillStyle = 'rgba(180,220,255,1)';
      ctx.fillText('AVIATION  •  STORIES  •  INSIGHTS', W/2, H/2 + 128);
    }
    ctx.restore();
  }

  // ── impact flare ─────────────────────────────
  var fl = remap(T, 5.4, 5.8) * (1 - remap(T, 5.8, 6.5));
  if (fl > 0) {
    var fg = ctx.createRadialGradient(W/2,H/2,0, W/2,H/2, W*.6);
    fg.addColorStop(0, 'rgba(255,255,255,' + (0.22*fl) + ')');
    fg.addColorStop(0.3, 'rgba(100,180,255,' + (0.12*fl) + ')');
    fg.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = fg; ctx.fillRect(0,0,W,H);
  }

  // ── vignette ─────────────────────────────────
  var vg = ctx.createRadialGradient(W/2,H/2, H*.28, W/2,H/2, H*.88);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.75)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  // ── fade in ───────────────────────────────────
  var fi = 1 - remap(T, 0, 0.75);
  if (fi > 0) { ctx.fillStyle = 'rgba(0,0,0,'+fi+')'; ctx.fillRect(0,0,W,H); }

  // ── fade out ──────────────────────────────────
  var fo = remap(T, 9.5, 10.6);
  if (fo > 0) { ctx.fillStyle = 'rgba(0,0,0,'+fo+')'; ctx.fillRect(0,0,W,H); }

  if (T < 11.5) rafId = requestAnimationFrame(render);
}

// ══════════════════════════════════════════════
//  BOOT — draw one preview frame, wait for click
// ══════════════════════════════════════════════
(function previewFrame() {
  // draw stars on black so the canvas isn't blank
  ctx.fillStyle = '#060d1a'; ctx.fillRect(0,0,W,H);
  for (var i = 0; i < STARS.length; i++) {
    var s = STARS[i];
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.15 + Math.random()*0.35) + ')';
    ctx.fill();
  }
})();

document.getElementById('btn').addEventListener('click', function() {
  this.style.display = 'none';
  startAudio();
  startTime = null;
  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(render);
});
</script>
</body>
</html>
