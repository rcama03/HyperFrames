<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Reise Insider — Animated Logo Overlay</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:transparent;width:1920px;height:1080px;overflow:hidden}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* =====================================================
   REISE INSIDER — Animated Logo Overlay
   1920×1080 transparent canvas · logo top-left
   20-second seamless loop · all periods divide 20s

   Sharpness strategy:
   - DPR scaling so canvas pixels match physical pixels
   - Glows rendered as separate blurred layers BEFORE
     crisp strokes/text — shadow never touches final edges
   - Text rendered twice: once for glow, once sharp on top
   - imageSmoothingEnabled off for pixel-perfect lines
   ===================================================== */

var W=1920, H=1080;
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var cv = document.getElementById('c');
var g  = cv.getContext('2d', { alpha: true });

// Physical pixels
cv.width  = W * DPR;
cv.height = H * DPR;
// CSS size stays logical
cv.style.width  = W + 'px';
cv.style.height = H + 'px';
g.scale(DPR, DPR);
g.imageSmoothingEnabled = false;

// ── Logo geometry ──────────────────────────────────
var CX=130, CY=130;
var RO=95;
var RI=Math.round(RO*0.582);   // ≈ 55
var RT=Math.round((RO+RI)/2);  // ≈ 75

// ── Off-screen glow canvas (blurred layers only) ──
// We composite blurred glow here then draw sharp art on top of it.
var gc  = document.createElement('canvas');
gc.width  = cv.width;
gc.height = cv.height;
var gg  = gc.getContext('2d', { alpha: true });
gg.scale(DPR, DPR);

// ── Arc text — no shadow, pure crisp fill ──────────
function arcText(ctx, text, r, centerAngle, isBottom, col, fontSize, spacing) {
  ctx.save();
  ctx.font = '800 ' + fontSize + 'px "Arial Black",Arial,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = col;
  ctx.shadowBlur = 0;  // always off here — glow drawn separately

  var widths=[], totalW=0;
  for(var i=0;i<text.length;i++){
    var w=ctx.measureText(text[i]).width; widths.push(w); totalW+=w;
  }
  totalW += (text.length-1)*spacing;
  var totalAng = totalW/r, cumW = 0;

  for(var i=0;i<text.length;i++){
    var charMid = cumW + widths[i]/2, theta;
    if(!isBottom) theta = (centerAngle - totalAng/2) + charMid/r;
    else          theta = (centerAngle + totalAng/2) - charMid/r;
    var px = CX + r*Math.cos(theta), py = CY + r*Math.sin(theta);
    var rot = isBottom ? theta - Math.PI/2 : theta + Math.PI/2;
    ctx.save(); ctx.translate(px,py); ctx.rotate(rot);
    ctx.fillText(text[i],0,0); ctx.restore();
    cumW += widths[i] + spacing;
  }
  ctx.restore();
}

// ── Glow-only arc text (blurred, onto gg) ─────────
function arcTextGlow(text, r, centerAngle, isBottom, col, fontSize, spacing, blur) {
  gg.save();
  gg.font = '800 ' + fontSize + 'px "Arial Black",Arial,sans-serif';
  gg.textAlign = 'center';
  gg.textBaseline = 'middle';
  gg.fillStyle = col;
  gg.shadowColor = col;
  gg.shadowBlur = blur * DPR;

  var widths=[], totalW=0;
  for(var i=0;i<text.length;i++){
    var w=gg.measureText(text[i]).width; widths.push(w); totalW+=w;
  }
  totalW += (text.length-1)*spacing;
  var totalAng = totalW/r, cumW = 0;

  for(var i=0;i<text.length;i++){
    var charMid = cumW + widths[i]/2, theta;
    if(!isBottom) theta = (centerAngle - totalAng/2) + charMid/r;
    else          theta = (centerAngle + totalAng/2) - charMid/r;
    var px = CX + r*Math.cos(theta), py = CY + r*Math.sin(theta);
    var rot = isBottom ? theta - Math.PI/2 : theta + Math.PI/2;
    gg.save(); gg.translate(px,py); gg.rotate(rot);
    gg.fillText(text[i],0,0); gg.restore();
    cumW += widths[i] + spacing;
  }
  gg.restore();
}

// ── Diamond ────────────────────────────────────────
function diamond(ctx, x, y, sz, col){
  ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.moveTo(0,-sz); ctx.lineTo(sz,0);
  ctx.lineTo(0,sz); ctx.lineTo(-sz,0);
  ctx.closePath(); ctx.fillStyle=col; ctx.fill(); ctx.restore();
}

// ── Aircraft (sharp, no shadow) ───────────────────
function aircraft(sc){
  g.save(); g.translate(CX,CY); g.rotate(-Math.PI/16); g.scale(sc,sc);
  g.fillStyle='#ffffff'; g.shadowBlur=0;
  g.beginPath(); g.moveTo(22,0); g.lineTo(-16,-5); g.lineTo(-16,5); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(4,0); g.lineTo(-10,-26); g.lineTo(-16,-5); g.closePath(); g.fill();
  g.beginPath(); g.moveTo(4,0); g.lineTo(-10,26);  g.lineTo(-16,5);  g.closePath(); g.fill();
  g.beginPath(); g.moveTo(-16,-5); g.lineTo(-24,-14); g.lineTo(-20,0);
               g.lineTo(-24,14); g.lineTo(-16,5); g.closePath(); g.fill();
  g.restore();
}

// ── Aircraft glow (onto gg) ───────────────────────
function aircraftGlow(sc, blur, col){
  gg.save(); gg.translate(CX,CY); gg.rotate(-Math.PI/16); gg.scale(sc,sc);
  gg.fillStyle=col; gg.shadowColor=col; gg.shadowBlur=blur*DPR;
  gg.beginPath(); gg.moveTo(22,0); gg.lineTo(-16,-5); gg.lineTo(-16,5); gg.closePath(); gg.fill();
  gg.beginPath(); gg.moveTo(4,0); gg.lineTo(-10,-26); gg.lineTo(-16,-5); gg.closePath(); gg.fill();
  gg.beginPath(); gg.moveTo(4,0); gg.lineTo(-10,26);  gg.lineTo(-16,5);  gg.closePath(); gg.fill();
  gg.beginPath(); gg.moveTo(-16,-5); gg.lineTo(-24,-14); gg.lineTo(-20,0);
                gg.lineTo(-24,14); gg.lineTo(-16,5); gg.closePath(); gg.fill();
  gg.restore();
}

var LOOP = 20;

function draw(ts){
  var T = (ts/1000) % LOOP;
  var glow    = 0.5 + 0.5*Math.sin(T*2*Math.PI/4);
  var dotAng  = T*2*Math.PI/20;
  var breathe = 1.0 + 0.028*Math.sin(T*2*Math.PI/4);
  var scanner = T*2*Math.PI/20;
  var acScale = RI*0.034*breathe;

  // ── 1. Clear both canvases ──────────────────────
  g.clearRect(0,0,W,H);
  gg.clearRect(0,0,W,H);

  // ── 2. Render all GLOW layers onto gg ──────────

  // Ring background (dark fill — not a glow, but belongs under everything)
  var fill = gg.createRadialGradient(CX,CY,0,CX,CY,RO);
  fill.addColorStop(0,   '#101e38');
  fill.addColorStop(0.65,'#0a1628');
  fill.addColorStop(1,   '#060e1c');
  gg.beginPath(); gg.arc(CX,CY,RO,0,Math.PI*2); gg.fillStyle=fill; gg.fill();

  // Scanner beam
  gg.save(); gg.translate(CX,CY); gg.rotate(scanner);
  for(var sa=0; sa<Math.PI*0.55; sa+=0.025){
    var fade=1-sa/(Math.PI*0.55);
    gg.beginPath(); gg.moveTo(0,0); gg.arc(0,0,RI*0.88,-sa,-sa+0.03); gg.closePath();
    gg.fillStyle='rgba(0,200,130,'+(0.07*fade*glow)+')'; gg.fill();
  }
  gg.restore();

  // Outer ring glow (wide soft halo)
  var outerBlur = 14 + 10*glow;
  gg.save();
  gg.shadowColor='#ffd700'; gg.shadowBlur=outerBlur*DPR;
  gg.beginPath(); gg.arc(CX,CY,RO,0,Math.PI*2);
  gg.strokeStyle='rgba(255,210,0,0.5)'; gg.lineWidth=10; gg.stroke();
  gg.restore();

  // Cyan halo
  gg.save();
  gg.shadowColor='#00ccff'; gg.shadowBlur=(outerBlur*0.6)*DPR;
  gg.beginPath(); gg.arc(CX,CY,RO,0,Math.PI*2);
  gg.strokeStyle='rgba(0,200,255,0.25)'; gg.lineWidth=8; gg.stroke();
  gg.restore();

  // Inner ring glow
  var innerBlur = 8 + 8*glow;
  gg.save();
  gg.shadowColor='#00ccff'; gg.shadowBlur=innerBlur*DPR;
  gg.beginPath(); gg.arc(CX,CY,RI,0,Math.PI*2);
  gg.strokeStyle='rgba(0,200,255,0.5)'; gg.lineWidth=4; gg.stroke();
  gg.restore();

  // Inner fill
  var iF=gg.createRadialGradient(CX,CY,0,CX,CY,RI);
  iF.addColorStop(0,'#0e1e38'); iF.addColorStop(0.7,'#080f1c'); iF.addColorStop(1,'#050b15');
  gg.beginPath(); gg.arc(CX,CY,RI,0,Math.PI*2); gg.fillStyle=iF; gg.fill();

  // Dot glows
  [0,90,180,270].forEach(function(base){
    var rad=base*Math.PI/180 - dotAng;
    var dx=CX+Math.cos(rad)*RI, dy=CY+Math.sin(rad)*RI;
    gg.save(); gg.shadowColor='#00ffcc'; gg.shadowBlur=8*DPR;
    gg.beginPath(); gg.arc(dx,dy,3.5,0,Math.PI*2);
    gg.fillStyle='rgba(0,200,255,0.7)'; gg.fill(); gg.restore();
  });

  // Aircraft glow
  aircraftGlow(acScale, 16+8*glow, '#0066ff');

  // Text glows
  var fREISE   = Math.round(RT*0.27);
  var fINSIDER = Math.round(RT*0.23);
  arcTextGlow('REISE',   RT, -Math.PI/2, false, '#00aaff', fREISE,   5, 8+4*glow);
  arcTextGlow('INSIDER', RT,  Math.PI/2, true,  '#ffaa00', fINSIDER, 3, 8+4*glow);

  // Diamond glows
  gg.save(); gg.shadowColor='#ffd700'; gg.shadowBlur=6*DPR;
  diamond(gg, CX+RT, CY, 3, 'rgba(255,215,0,0.6)');
  diamond(gg, CX-RT, CY, 3, 'rgba(255,215,0,0.6)');
  gg.restore();

  // Vignette
  var vig=gg.createRadialGradient(CX,CY,RI*0.6,CX,CY,RO);
  vig.addColorStop(0,'rgba(0,0,0,0)'); vig.addColorStop(1,'rgba(0,0,0,0.35)');
  gg.beginPath(); gg.arc(CX,CY,RO,0,Math.PI*2); gg.fillStyle=vig; gg.fill();

  // ── 3. Composite glow canvas onto main canvas ──
  g.drawImage(gc, 0, 0, W, H);

  // ── 4. Draw all SHARP layers onto main canvas ──
  // (no shadowBlur at all from here down)

  // Outer tick marks
  for(var a=0; a<360; a+=5){
    var rad=a*Math.PI/180;
    var isQ=(a%90===0), is30=(a%30===0);
    var tLen=isQ?5:is30?3:1.5;
    g.beginPath();
    g.moveTo(CX+Math.cos(rad)*(RO-tLen), CY+Math.sin(rad)*(RO-tLen));
    g.lineTo(CX+Math.cos(rad)*RO,        CY+Math.sin(rad)*RO);
    g.strokeStyle=isQ?'rgba(255,210,0,1)':'rgba(0,200,255,0.5)';
    g.lineWidth=isQ?1.5:0.7; g.stroke();
  }

  // Outer ring — crisp gradient stroke
  var og=g.createLinearGradient(CX-RO,CY,CX+RO,CY);
  og.addColorStop(0,'#00ccff'); og.addColorStop(0.45,'#ffd700');
  og.addColorStop(0.55,'#ffd700'); og.addColorStop(1,'#00ccff');
  g.beginPath(); g.arc(CX,CY,RO,0,Math.PI*2);
  g.strokeStyle=og; g.lineWidth=2.5; g.stroke();

  // Thin white highlight on inner edge of outer ring
  g.beginPath(); g.arc(CX,CY,RO-1.5,0,Math.PI*2);
  g.strokeStyle='rgba(255,255,255,0.18)'; g.lineWidth=0.8; g.stroke();

  // Inner ring — crisp cyan
  g.beginPath(); g.arc(CX,CY,RI,0,Math.PI*2);
  g.strokeStyle='#00ccff'; g.lineWidth=1.5; g.stroke();

  // Dots — crisp
  [0,90,180,270].forEach(function(base){
    var rad=base*Math.PI/180 - dotAng;
    var dx=CX+Math.cos(rad)*RI, dy=CY+Math.sin(rad)*RI;
    g.beginPath(); g.arc(dx,dy,2.2,0,Math.PI*2);
    g.fillStyle='#00eeff'; g.fill();
  });

  // Aircraft — crisp white
  aircraft(acScale);

  // Text — crisp
  arcText(g, 'REISE',   RT, -Math.PI/2, false, '#ffffff', fREISE,   5);
  arcText(g, 'INSIDER', RT,  Math.PI/2, true,  '#ffd700', fINSIDER, 3);

  // Diamonds — crisp
  diamond(g, CX+RT, CY, 2.5, '#ffd700');
  diamond(g, CX-RT, CY, 2.5, '#ffd700');

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);
</script>
</body>
</html>
